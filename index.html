function startSim(id){const s=SIMS.find(x=>x.id===id);if(!s)return go('training');cur={sim:s,i:-1,score:0,free:S.simMode==='free'};drawSim()}
function similarity(a,b){const A=norm(a).split(' ').filter(Boolean),B=norm(b).split(' ').filter(Boolean);if(!A.length||!B.length)return 0;const pool=B.slice();let m=0;A.forEach(t=>{const k=pool.indexOf(t);if(k>=0){m++;pool.splice(k,1)}});const p=m/A.length,r=m/B.length;return p+r?2*p*r/(p+r):0}
function drawSim(){
  closeFb();
  const {sim,i,free}=cur;const n=sim.steps.length;
  app.innerHTML=`<div class="lhead"><button class="x" onclick="go('training')" aria-label="Schliessen">✕</button><div class="pbar"><i style="width:${Math.round((i+1)/(n+1)*100)}%"></i></div></div><div id="stage" class="anim"></div>`;
  const box=$('#stage');
  const nextStep=()=>{cur.i++;drawSim();window.scrollTo(0,0)};
  if(i===-1){box.innerHTML=`<div class="kicker">Simulation ${sim.id} · ${free?'Freitext':'Auswahl'}</div><h1>${esc(sim.t)}</h1><div class="card"><h3>Situation</h3><p>${esc(sim.intro)}</p></div><p class="mut small">${free?'Schreibe deine Antworten selbst. Danach siehst du eine Musterlösung und einen Vergleich.':'Wähle jeweils die passende Antwort. Danach siehst du eine Erklärung.'}</p><button class="btn" id="go">Simulation starten</button>`;$('#go').onclick=nextStep;return}
  if(i>=n){
    const best=Math.max(S.sims[sim.id]||0,cur.score);const first=!S.sims[sim.id];S.sims[sim.id]=best;
    const g=(first?30:10)+cur.score*10;addXp(g);checkBadges();
    box.innerHTML=`<div class="center" style="padding-top:20px"><div style="font-size:60px">🎧</div><h1>Simulation beendet</h1><p class="mut">${cur.score}/${n} Schritte gut gelöst · +${g} XP</p></div>
    <div class="card"><h3>Gesprächsverlauf (Musterlösung)</h3>${sim.steps.map(s=>{const o=s.opts.find(x=>x[2]);return `${s.npc?`<div class="small mut" style="margin-top:8px">Gegenüber: <i>${esc(s.npc)}</i></div>`:''}<div class="small"><b>Du: ${esc(o[0])}</b><br><span class="mut">${esc(o[1])}</span></div>`}).join('')}</div>
    <div class="row"><button class="btn ghost" onclick="startSim(${sim.id})">Nochmals</button><button class="btn" onclick="go('training')">Übersicht</button></div>`;return}
  const st=sim.steps[i];const right=st.opts.find(o=>o[2]);
  box.innerHTML=`<p class="mut small" style="margin:0 0 6px">Schritt ${i+1}/${n} · ${esc(sim.t)}</p>
  ${st.npc?`<div class="dlg"><div class="bub">${sayBtn(st.npc)}<div class="who">Gegenüber</div><div class="rm">${esc(st.npc)}</div><div class="de" id="npcde" style="display:none">${esc(st.npcDe)}</div><button class="chip" style="margin-top:6px;min-height:34px;padding:4px 12px" onclick="document.getElementById('npcde').style.display='block';this.remove()">Übersetzung zeigen</button></div></div>`:''}
  <div class="sit"><b>Deine Aufgabe:</b> ${esc(st.task)}</div><div id="ans"></div>`;
  if(st.npc)setTimeout(()=>speak(st.npc),250);
  const ans=$('#ans');
  const after=(ok,html)=>{if(ok)cur.score++;const extra=st.reply?`<div class="mt small">Antwort: <i>${esc(st.reply)}</i> – ${esc(st.replyDe)}</div>`:'';feedback(ok,html+extra,nextStep)};
  if(!free){
    const opts=shuffle(st.opts);
    ans.innerHTML=`<div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}">${esc(o[0])}</button>`).join('')}</div>`;
    ans.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.k];ans.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(opts[+x.dataset.k][2])x.classList.add('ok')});if(!o[2])b.classList.add('bad');speak(right[0]);
      after(!!o[2],`${o[2]?'':`Deine Wahl: <i>${esc(o[1])}</i><br>${esc(o[3]||'')}<br><br>Besser: `}<b>${esc(right[0])}</b><br><span class="small">${esc(right[1])}</span>${o[2]?`<br><span class="small">${esc(right[3])}</span>`:''}`)});
  }else{
    ans.innerHTML=`<textarea class="inp" id="ftxt" autocapitalize="sentences" autocorrect="off" spellcheck="false" placeholder="Deine Antwort auf Rumantsch …"></textarea>
    <div class="row mt"><button class="btn ghost" id="hint">Tipp</button><button class="btn" id="cmp">Vergleichen</button></div><div id="hintbox" class="small mut mt"></div>`;
    $('#hint').onclick=()=>{const w=right[0].split(' ');$('#hintbox').textContent='Beginnt mit: «'+w.slice(0,Math.min(3,Math.ceil(w.length/3))).join(' ')+' …»'};
    $('#cmp').onclick=()=>{const t=$('#ftxt').value.trim();if(!t){toast('Schreibe zuerst eine Antwort.');return}
      const sim2=similarity(t,right[0]);const it=norm(t).split(' ');
      const marks=right[0].split(' ').map(w=>`<span class="${it.includes(norm(w))?'y':'n'}">${esc(w)}</span>`).join(' ');
      const lvl=sim2>=.85?'Sehr gut – fast identisch mit der Musterlösung.':sim2>=.6?'Gut – die wichtigsten Wörter sind da.':sim2>=.35?'Teilweise richtig – vergleiche mit der Musterlösung.':'Deutlich abweichend – lies die Musterlösung laut mit.';
      speak(right[0]);$('#ftxt').disabled=true;
      after(sim2>=.6,`Übereinstimmung: <b>${Math.round(sim2*100)} %</b> – ${lvl}<div class="cmp mt">${marks}</div><div class="small mt">${esc(right[1])}</div><div class="small mt mut">Grün = in deiner Antwort enthalten. Andere Formulierungen können ebenfalls korrekt sein.</div>`)};
  }
}

/* ================= VOKABELTRAINER ================= */
let VS={tab:'list',q:'',cat:'',fav:false,deck:null,di:0,flip:false,dir:'rm',rev:null};
function vocabTab(t){VS.tab=t;VS.deck=null;VS.rev=null;vVocab()}
function filtered(){const q=norm(VS.q);return VOCAB.filter(w=>(!VS.cat||w.cat===VS.cat)&&(!VS.fav||S.fav[w.rm])&&(!q||norm(w.rm).includes(q)||norm(w.de).includes(q)))}
function weightPick(list,n){const a=list.map(w=>{const o=S.words[w.rm]||{box:0,w:0};return {w,k:Math.pow(Math.random(),1/(1+o.w*2+(5-o.box)*1.5))}});return a.sort((x,y)=>y.k-x.k).slice(0,n).map(x=>x.w)}
function vVocab(){
  const tabs=`<div class="chips">${[['list','📖 Liste'],['cards','🃏 Karteikarten'],['rev','🔁 Wiederholen']].map(([k,t])=>`<button class="chip ${VS.tab===k?'on':''}" onclick="vocabTab('${k}')">${t}</button>`).join('')}</div>`;
  const filt=`<input class="inp" id="vq" type="search" placeholder="Suchen (Rumantsch oder Deutsch) …" value="${esc(VS.q)}" style="margin-bottom:10px">
  <div class="chips"><button class="chip ${!VS.cat&&!VS.fav?'on':''}" data-c="">Alle</button><button class="chip ${VS.fav?'on':''}" data-f="1">★ Favoriten</button>${CATS.map(c=>`<button class="chip ${VS.cat===c?'on':''}" data-c="${c}">${c}</button>`).join('')}</div>`;
  app.innerHTML=`<div class="anim"><h1>Vokabeln</h1><p class="mut small">${VOCAB.length} Wörter · ${learnedCount()} gelernt · Falsch beantwortete Wörter kommen häufiger dran.</p>${tabs}<div id="vb"></div></div>`;
  const vb=$('#vb');
  const bindFilt=()=>{const q=$('#vq');q.oninput=()=>{VS.q=q.value;VS.deck=null;drawBody(true)};
    vb.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{VS.cat=b.dataset.c;VS.fav=false;VS.deck=null;vVocab()});
    vb.querySelectorAll('[data-f]').forEach(b=>b.onclick=()=>{VS.fav=!VS.fav;VS.cat='';VS.deck=null;vVocab()});};
  function drawBody(keep){
    const list=filtered();
    if(VS.tab==='list'){
      const html=list.length?list.slice(0,400).map(w=>{const ex=exampleFor(w);const o=S.words[w.rm];return `<div class="word"><button class="star ${S.fav[w.rm]?'on':''}" data-fav="${esc(w.rm)}" aria-label="Favorit">★</button><div class="w"><div class="rm">${esc(w.rm)}${w.u?'<span class="badge">ungeprüft</span>':''}</div><div class="pr">≈ ${esc(pron(w.rm))}</div><div class="de">${esc(w.de)}</div><div class="small mut">${w.cat}${w.lesson?' · L'+w.lesson:''}${o?` · ✓${o.r} ✗${o.w}`:''}</div>${ex?`<div class="ex">${esc(ex.rm)}<br>${esc(ex.de)}</div>`:''}</div>${sayBtn(w.rm)}</div>`}).join(''):'<p class="mut">Keine Wörter gefunden.</p>';
      if(keep&&$('#vlist')){$('#vlist').innerHTML=html;bindStars();return}
      vb.innerHTML=filt+`<div class="card" id="vlist">${html}</div>`;bindFilt();bindStars();
    }else if(VS.tab==='cards'){
      if(!VS.deck){VS.deck=weightPick(list,Math.min(20,list.length));VS.di=0;VS.flip=false}
      if(keep){vb.querySelector('#cardzone').innerHTML=cardHtml();bindCard();return}
      vb.innerHTML=filt+`<div class="chips"><button class="chip ${VS.dir==='rm'?'on':''}" data-d="rm">Rumantsch → Deutsch</button><button class="chip ${VS.dir==='de'?'on':''}" data-d="de">Deutsch → Rumantsch</button></div><div id="cardzone">${cardHtml()}</div>`;
      bindFilt();vb.querySelectorAll('[data-d]').forEach(b=>b.onclick=()=>{VS.dir=b.dataset.d;VS.flip=false;vVocab()});bindCard();
    }else{
      if(!VS.rev){const learned=VOCAB.filter(w=>S.words[w.rm]||(w.lesson&&isDone(w.lesson)));const base=learned.length>=6?learned:GROUPS.A[0].v.concat(GROUPS.A[1].v);
        const qs=weightPick(base,Math.min(10,base.length)).map((w,k)=>{const pool=shuffle(VOCAB.filter(x=>x.cat===w.cat&&x!==w));return k%3===2?qType(w):k%2?qDeRm(w,pool):qRmDe(w,pool)});VS.rev={qs,i:0,ok:0}}
      const R=VS.rev;
      if(R.i>=R.qs.length){addXp(R.ok*5);checkBadges();vb.innerHTML=`<div class="card center"><div style="font-size:52px">✅</div><h2>Wiederholung beendet</h2><p class="mut">${R.ok}/${R.qs.length} richtig · +${R.ok*5} XP</p><button class="btn" onclick="VS.rev=null;vVocab()">Neue Runde</button></div>`;return}
      vb.innerHTML=`<p class="mut small">Frage ${R.i+1}/${R.qs.length} · Schwache Wörter werden bevorzugt.</p><div class="card"><div id="rq"></div></div>`;
      renderQ(R.qs[R.i],$('#rq'),(ok,html)=>{if(ok)R.ok++;feedback(ok,html,()=>{R.i++;vVocab()})});
    }
  }
  function bindStars(){vb.querySelectorAll('[data-fav]').forEach(b=>b.onclick=()=>{const k=b.dataset.fav;if(S.fav[k])delete S.fav[k];else S.fav[k]=1;save();b.classList.toggle('on')})}
  function cardHtml(){const d=VS.deck;if(!d.length)return '<p class="mut">Keine Wörter in dieser Auswahl.</p>';
    if(VS.di>=d.length)return `<div class="card center"><div style="font-size:48px">🃏</div><h2>Stapel durch!</h2><button class="btn" onclick="VS.deck=null;vVocab()">Neuer Stapel</button></div>`;
    const w=d[VS.di];const f=VS.dir==='rm'?w.rm:w.de,b=VS.dir==='rm'?w.de:w.rm;const ex=exampleFor(w);
    return `<p class="mut small center">Karte ${VS.di+1}/${d.length} · Tippen zum Umdrehen</p><div class="flash"><div class="fc ${VS.flip?'flip':''}" id="fc"><div class="side"><div class="kicker">${VS.dir==='rm'?'Rumantsch':'Deutsch'}</div><div class="big">${esc(f)}</div>${VS.dir==='rm'?`<div class="pr mut">≈ ${esc(pron(w.rm))}</div>`:''}</div><div class="side back"><div class="kicker">${VS.dir==='rm'?'Deutsch':'Rumantsch'}</div><div class="big">${esc(b)}</div>${w.u?'<span class="badge">ungeprüft</span>':''}${ex?`<div class="small mut mt">${esc(ex.rm)}<br>${esc(ex.de)}</div>`:''}</div></div></div>
    <div class="row">${sayBtn(w.rm).replace('class="say"','class="say" style="width:54px;height:54px;flex:0 0 54px"')}<button class="btn ghost" id="cno">✗ Nochmals</button><button class="btn" id="cyes">✓ Gewusst</button></div>`}
  function bindCard(){const fc=$('#fc');if(fc)fc.onclick=()=>{VS.flip=!VS.flip;fc.classList.toggle('flip')};
    const y=$('#cyes'),n=$('#cno');const step=ok=>{const w=VS.deck[VS.di];rec(w,ok);if(!ok)VS.deck.push(w);VS.di++;VS.flip=false;if(ok)addXp(2);$('#cardzone').innerHTML=cardHtml();bindCard()};
    if(y)y.onclick=()=>step(true);if(n)n.onclick=()=>step(false)}
  drawBody();
}

/* ================= FORTSCHRITT ================= */
function vProg(){
  const catRows=CATS.map(c=>{const o=S.cat[c];if(!o||o.r+o.w===0)return {c,p:null};return {c,p:o.r/(o.r+o.w),n:o.r+o.w}});
  const rated=catRows.filter(x=>x.p!==null).sort((a,b)=>b.p-a.p);
  const tests=Object.entries(S.tests).sort((a,b)=>+a[0]-+b[0]);
  app.innerHTML=`<div class="anim"><h1>Fortschritt</h1>
  <div class="grid2"><div class="kpi"><b>⭐ ${S.xp}</b><span>XP</span></div><div class="kpi"><b>🔥 ${streakNow()}</b><span>Lernserie (Tage)</span></div>
  <div class="kpi"><b>${doneCount()}/40</b><span>Lektionen</span></div><div class="kpi"><b>${learnedCount()}/${VOCAB.length}</b><span>Wörter gelernt</span></div>
  <div class="kpi"><b>${Object.keys(S.sims).length}/6</b><span>Simulationen</span></div><div class="kpi"><b>${S.badges.length}/${BADGES.length}</b><span>Abzeichen</span></div></div>
  <h2>Module</h2><div class="card">${['A','B','C'].map(m=>`<div style="margin:6px 0 14px"><div class="sw" style="padding:0 0 6px"><b>${MODNAME[m]}</b><span class="mut small">${GROUPS[m].filter(l=>isDone(l.id)).length}/${GROUPS[m].length}</span></div><div class="pbar"><i style="width:${Math.round(modProg(m)*100)}%"></i></div></div>`).join('')}</div>
  <h2>Stärken und Schwächen</h2><div class="card">${rated.length?rated.map(x=>`<div style="margin:6px 0 12px"><div class="sw" style="padding:0 0 6px"><span>${x.c}</span><span class="small ${x.p>=.8?'':'mut'}">${Math.round(x.p*100)} % · ${x.n} Antworten</span></div><div class="pbar"><i style="width:${Math.round(x.p*100)}%;background:${x.p>=.8?'var(--ok)':x.p>=.6?'#E8A400':'var(--red)'}"></i></div></div>`).join('')+`<p class="small mut mt">${rated.length>1?`Stärke: <b>${rated[0].c}</b> · Üben: <b>${rated[rated.length-1].c}</b>`:'Mach weitere Übungen für eine genauere Auswertung.'}</p>`:'<p class="mut">Noch keine Daten – starte eine Lektion.</p>'}</div>
  <h2>Abzeichen</h2><div class="bdg">${BADGES.map(b=>`<div class="${S.badges.includes(b.id)?'on':''}" title="${esc(b.d)}"><i>${b.i}</i>${b.t}<div class="small mut" style="font-weight:400;font-size:12px;margin-top:2px">${b.d}</div></div>`).join('')}</div>
  <p class="small mut mt">A1/A2-Abzeichen sind App-interne Meilensteine und keine offiziellen Sprachzertifikate.</p>
  <h2>Testergebnisse</h2><div class="card">${tests.length?tests.map(([id,t])=>`<div class="sw" style="border-bottom:1px solid var(--line)"><span class="small">L${id} · ${esc(BYID[id].t)}</span><span class="badge ${t.best>=4?'g':'r'}">${t.best}/6</span></div>`).join(''):'<p class="mut">Noch keine Tests absolviert.</p>'}</div>
  <h2>Daten</h2><div class="card"><p class="small mut">Dein Fortschritt wird nur lokal auf diesem Gerät gespeichert (localStorage). Beim Löschen der Website-Daten geht er verloren.</p><button class="btn ghost" id="reset">Fortschritt zurücksetzen</button></div></div>`;
  $('#reset').onclick=()=>{if(confirm('Wirklich den gesamten Fortschritt löschen?')){S=defState();save();toast('Fortschritt zurückgesetzt');render()}};
}

(function icon(){try{const c=document.createElement('canvas');c.width=c.height=180;const x=c.getContext('2d');x.fillStyle='#D52B1E';x.fillRect(0,0,180,180);x.fillStyle='#fff';x.fillRect(72,36,36,108);x.fillRect(36,72,108,36);const l=document.createElement('link');l.rel='apple-touch-icon';l.href=c.toDataURL('image/png');document.head.appendChild(l);const f=document.createElement('link');f.rel='icon';f.href=l.href;document.head.appendChild(f)}catch(e){}})();
render();
</script>
