<!DOCTYPE html>
<html lang="de">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>Rumantsch Academy</title>
<style>
:root{--red:#D52B1E;--red-d:#A91F15;--red-l:#FDECEA;--bg:#F4F4F6;--card:#fff;--txt:#1C1C1E;--mut:#6B6B70;--line:#E4E4E8;--ok:#1B8F52;--ok-l:#E5F5EC;--bad:#C62828;--bad-l:#FDECEC;--warn:#9A5B00;--warn-l:#FFF3DC;--r:18px;--sh:0 1px 2px rgba(0,0,0,.04),0 4px 14px rgba(0,0,0,.05)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font:17px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--txt);-webkit-text-size-adjust:100%;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;font-size:17px}
h1{font-size:28px;line-height:1.15;margin:4px 0 12px;letter-spacing:-.02em}
h2{font-size:21px;margin:26px 0 10px;letter-spacing:-.01em}
h3{font-size:18px;margin:0 0 6px}
p{margin:0 0 10px}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:saturate(180%) blur(16px);-webkit-backdrop-filter:saturate(180%) blur(16px);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;gap:10px}
.logo{width:32px;height:32px;border-radius:9px;background:var(--red);position:relative;flex:none}
.logo:before,.logo:after{content:"";position:absolute;background:#fff;border-radius:1px}
.logo:before{left:13px;top:7px;width:6px;height:18px}.logo:after{left:7px;top:13px;width:18px;height:6px}
.top b{font-size:18px;letter-spacing:-.01em}
.top .stat{margin-left:auto;display:flex;gap:12px;font-size:15px;font-weight:600;color:var(--mut)}
.top .stat span{display:flex;align-items:center;gap:4px}
main{max-width:760px;margin:0 auto;padding:16px 16px calc(100px + env(safe-area-inset-bottom))}
.tabs{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.94);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);display:flex;justify-content:center;padding:6px 4px calc(6px + env(safe-area-inset-bottom));z-index:30}
.tabs .in{display:flex;width:100%;max-width:760px}
.tabs button{flex:1;background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;font-weight:500;color:var(--mut);padding:4px 0;min-height:52px}
.tabs button.on{color:var(--red)}
.tabs svg,.ic{width:25px;height:25px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
body.focus .tabs,body.focus .top{display:none}
body.focus main{padding-top:calc(env(safe-area-inset-top) + 8px)}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--sh);margin-bottom:14px}
.card.red{background:linear-gradient(135deg,#D52B1E,#B3231A);color:#fff}
.card.red .mut{color:rgba(255,255,255,.85)}
.card.warn{background:var(--warn-l);color:#5a3a00;box-shadow:none;font-size:15px}
.mut{color:var(--mut)}
.small{font-size:15px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:54px;border:0;border-radius:15px;background:var(--red);color:#fff;font-weight:650;font-size:17px;padding:12px 18px;transition:transform .12s,background .2s}
.btn:active{transform:scale(.98)}
.btn.sec{background:var(--red-l);color:var(--red-d)}
.btn.ghost{background:#fff;color:var(--txt);border:1.5px solid var(--line)}
.btn.wht{background:#fff;color:var(--red-d)}
.btn[disabled]{opacity:.45;pointer-events:none}
.row{display:flex;gap:10px}.row>*{flex:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font-size:15px;font-weight:550;min-height:40px}
.chip.on{background:var(--red);border-color:var(--red);color:#fff}
.pbar{height:10px;background:var(--line);border-radius:99px;overflow:hidden}
.pbar i{display:block;height:100%;background:var(--red);border-radius:99px;transition:width .4s ease}
.card.red .pbar{background:rgba(255,255,255,.3)}.card.red .pbar i{background:#fff}
.li{display:flex;align-items:center;gap:14px;background:#fff;border-radius:16px;padding:14px 16px;margin-bottom:10px;box-shadow:var(--sh);border:0;width:100%;text-align:left;min-height:68px}
.li .n{width:42px;height:42px;border-radius:12px;background:var(--red-l);color:var(--red-d);display:flex;align-items:center;justify-content:center;font-weight:700;flex:none}
.li.done .n{background:var(--ok);color:#fff}
.li.lock{opacity:.5}
.li.lock .n{background:var(--line);color:var(--mut)}
.li .t{flex:1;min-width:0}
.li .t b{display:block;font-size:17px;line-height:1.25}
.li .t small{color:var(--mut);font-size:14px}
.li .arr{color:var(--mut);font-size:22px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:99px;background:var(--warn-l);color:var(--warn);vertical-align:middle;margin-left:6px;letter-spacing:.01em}
.badge.g{background:var(--ok-l);color:var(--ok)}
.badge.r{background:var(--red-l);color:var(--red-d)}
.say{border:0;background:var(--red-l);color:var(--red-d);width:44px;height:44px;border-radius:12px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.say svg{width:22px;height:22px}
.word{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--line)}
.word:last-child{border-bottom:0}
.word .w{flex:1;min-width:0}
.word .rm{font-size:19px;font-weight:650}
.word .pr{font-size:14px;color:var(--mut);font-style:italic}
.word .de{font-size:16px}
.ex{font-size:15px;color:var(--mut);margin-top:6px;border-left:3px solid var(--red-l);padding-left:8px}
.star{border:0;background:none;font-size:24px;width:44px;height:44px;color:#C7C7CC;flex:none}
.star.on{color:#E8A400}
.lhead{position:sticky;top:0;z-index:10;background:var(--bg);display:flex;align-items:center;gap:12px;padding:8px 0 12px}
.lhead .x{border:0;background:#fff;width:44px;height:44px;border-radius:12px;font-size:22px;box-shadow:var(--sh);flex:none}
.lhead .pbar{flex:1}
.kicker{font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--red)}
.big{font-size:26px;font-weight:700;line-height:1.25;margin:6px 0 4px}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{border:2px solid var(--line);background:#fff;border-radius:15px;padding:14px 16px;text-align:left;font-size:17px;min-height:56px;transition:border-color .15s,background .15s}
.opt:active{transform:scale(.99)}
.opt.ok{border-color:var(--ok);background:var(--ok-l)}
.opt.bad{border-color:var(--bad);background:var(--bad-l)}
.opt.sel{border-color:var(--red)}
.opt[disabled]{pointer-events:none}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.match .opt{text-align:center;font-size:16px;padding:12px 8px}
.match .opt.gone{opacity:.35;border-color:var(--ok);background:var(--ok-l)}
.zone{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;padding:10px 0;margin:14px 0}
.bank{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.tile{border:2px solid var(--line);border-bottom-width:4px;background:#fff;border-radius:12px;padding:9px 13px;font-size:17px;min-height:46px}
.tile.used{visibility:hidden}
.inp{width:100%;border:2px solid var(--line);border-radius:14px;padding:14px;font-size:18px;background:#fff;outline:none}
.inp:focus{border-color:var(--red)}
textarea.inp{min-height:96px;resize:vertical}
.fb{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border-radius:22px 22px 0 0;box-shadow:0 -6px 24px rgba(0,0,0,.12);animation:up .22s ease}
.fb .in{max-width:728px;margin:0 auto}
.fb.ok{background:var(--ok-l);color:#0f5132}.fb.bad{background:var(--bad-l);color:#7a1414}
.fb.ok .btn{background:var(--ok)}.fb.bad .btn{background:var(--bad)}
.fb h3{font-size:20px}
@keyframes up{from{transform:translateY(100%)}to{transform:none}}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.anim{animation:fade .25s ease}
.dlg{display:flex;flex-direction:column;gap:10px;margin:12px 0}
.bub{max-width:88%;padding:12px 14px;border-radius:18px;background:#fff;box-shadow:var(--sh);position:relative}
.bub.B{align-self:flex-end;background:#FFF5F4}
.bub .who{font-size:12.5px;font-weight:700;color:var(--red);text-transform:uppercase;letter-spacing:.04em}
.bub .rm{font-size:18px;font-weight:600;margin:2px 0}
.bub .de{font-size:15px;color:var(--mut)}
.bub .pr{font-size:13.5px;color:var(--mut);font-style:italic}
.bub .say{width:36px;height:36px;float:right;margin:0 0 4px 8px}
.hidden-rm .bub.B .rm,.hidden-rm .bub.B .pr{filter:blur(6px);cursor:pointer}
.hide-de .bub .de{display:none}
.sw{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;font-size:16px}
.tgl{width:52px;height:32px;border-radius:99px;background:var(--line);border:0;position:relative;flex:none;transition:background .2s}
.tgl:after{content:"";position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .2s}
.tgl.on{background:var(--red)}.tgl.on:after{left:23px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.kpi{background:#fff;border-radius:16px;padding:14px;box-shadow:var(--sh)}
.kpi b{font-size:26px;display:block;letter-spacing:-.02em}
.kpi span{font-size:14px;color:var(--mut)}
.bdg{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:10px}
.bdg div{background:#fff;border-radius:16px;padding:14px 8px;text-align:center;box-shadow:var(--sh);font-size:13.5px;font-weight:600}
.bdg div i{display:block;font-style:normal;font-size:30px;margin-bottom:4px;filter:grayscale(1);opacity:.35}
.bdg div.on i{filter:none;opacity:1}
.bdg div:not(.on){color:var(--mut)}
.flash{perspective:1000px;margin:10px 0 16px}
.flash .fc{position:relative;height:250px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.flash .fc.flip{transform:rotateY(180deg)}
.flash .side{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:#fff;border-radius:22px;box-shadow:var(--sh);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
.flash .back{transform:rotateY(180deg);background:#FFF8F7}
.flash .side .big{font-size:28px}
table{width:100%;border-collapse:collapse;font-size:16px;margin:8px 0 12px}
td,th{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
td:first-child{font-weight:650}
details{background:#fff;border-radius:16px;box-shadow:var(--sh);margin-bottom:10px;overflow:hidden}
summary{padding:16px 18px;font-weight:650;font-size:17px;list-style:none;display:flex;justify-content:space-between;align-items:center;min-height:56px}
summary::-webkit-details-marker{display:none}
summary:after{content:"›";font-size:24px;color:var(--mut);transition:transform .2s}
details[open] summary:after{transform:rotate(90deg)}
details .dc{padding:0 18px 16px}
.sit{background:#F0F0F3;border-radius:14px;padding:12px 14px;font-size:15.5px;margin:10px 0}
.task{font-weight:650;margin:12px 0 4px}
.cmp span{display:inline-block;padding:2px 6px;border-radius:6px;margin:2px}
.cmp .y{background:var(--ok-l);color:var(--ok)}.cmp .n{background:var(--bad-l);color:var(--bad);text-decoration:underline dotted}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 14px);transform:translateX(-50%) translateY(-150%);background:#1C1C1E;color:#fff;padding:12px 18px;border-radius:14px;font-size:15px;z-index:60;max-width:90vw;transition:transform .3s ease;text-align:center}
#toast.on{transform:translateX(-50%) translateY(0)}
.center{text-align:center}
.mt{margin-top:14px}.mb{margin-bottom:14px}
.ring{width:120px;height:120px;margin:10px auto}
.sec-t{display:flex;align-items:center;justify-content:space-between;margin:24px 0 10px}
.sec-t h2{margin:0}
@media (min-width:820px){main{padding-left:24px;padding-right:24px}h1{font-size:32px}.opts.two{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>
<header class="top"><div class="logo"></div><b>Rumantsch Academy</b><div class="stat"><span id="hStreak">🔥 0</span><span id="hXp">⭐ 0</span></div></header>
<main id="app"></main>
<nav class="tabs"><div class="in" id="tabs"></div></nav>
<div id="toast"></div>
<script>
"use strict";
/* =========================================================
   RUMANTSCH ACADEMY – Rumantsch Grischun lernen
   Alle Daten lokal, Fortschritt in localStorage.
   Wörter mit "!" am Anfang = Fachbegriff ungeprüft.
   ========================================================= */

const RAW=[
/* ---------------- MODUL A – ALLTAG ---------------- */
{id:1,m:'A',cat:'Alltag',t:'Begrüssungen und Verabschiedungen',who:'A=Mirta,B=Gion',
intro:`In Graubünden begrüsst man sich auf Romanisch sehr oft mit «Allegra!». Das Wort passt fast immer – unter Freunden, im Dorf und auch am Telefon. Für formellere Situationen gibt es «Bun di!».`,
v:`Allegra! = Hallo! / Grüezi!
Bun di! = Guten Tag!
Buna saira! = Guten Abend!
Buna notg! = Gute Nacht!
Adia! = Tschüss! / Ade!
A revair! = Auf Wiedersehen!
A pli tard! = Bis später!
A damaun! = Bis morgen!
Grazia! = Danke!`,
s:`Allegra, Anna! = Hallo, Anna!
Bun di, signur Caduff! = Guten Tag, Herr Caduff!
Adia e grazia! = Tschüss und danke!
Buna saira e buna notg! = Guten Abend und gute Nacht!`,
d:`A: Allegra, Gion! = Hallo, Gion!
B: Allegra, Mirta! Co vai? = Hallo, Mirta! Wie geht's?
A: Bain, grazia. E tai? = Gut, danke. Und dir?
B: Era bain. Jau stoss ir a la lavur. = Auch gut. Ich muss zur Arbeit.
A: Alura, a pli tard! = Also, bis später!
B: Adia, a damaun! = Tschüss, bis morgen!`,
tip:`«Allegra» ist der typische romanische Gruss. «A damaun» bedeutet «bis morgen» – «damaun» allein heisst «morgen».`},

{id:2,m:'A',cat:'Alltag',t:'Sich vorstellen',who:'A=Luca,B=Seraina',
intro:`Hier lernst du, wie du deinen Namen sagst und nach dem Namen fragst. Auf Romanisch sagt man wörtlich «Ich habe Namen …».`,
v:`jau = ich
ti = du
il num = der Name
Co has ti num? = Wie heisst du?
Jau hai num … = Ich heisse …
Fa plaschair! = Freut mich!
signur = Herr
signura = Frau (Anrede)
esser = sein`,
s:`Jau hai num Luca. = Ich heisse Luca.
Mes num è Seraina. = Mein Name ist Seraina.
Jau sun Luca. = Ich bin Luca.
Co has ti num? = Wie heisst du?`,
d:`A: Allegra! Jau hai num Luca. Co has ti num? = Hallo! Ich heisse Luca. Wie heisst du?
B: Jau hai num Seraina. Fa plaschair! = Ich heisse Seraina. Freut mich!
A: Fa plaschair! Es ti nova qua? = Freut mich! Bist du neu hier?
B: Gea, jau lavur qua dapi glindesdi. = Ja, ich arbeite seit Montag hier.
A: Bainvegnida! = Willkommen!`,
tip:`«avair num» = «heissen» (wörtlich: Namen haben). «Bainvegnida» sagt man zu einer Frau, «Bainvegni» zu einem Mann.`},

{id:3,m:'A',cat:'Alltag',t:'Herkunft und Wohnort',who:'A=Gieri,B=Nina',
intro:`Woher kommst du und wo wohnst du? Bei Städten verwendet man «a» (a Cuira), bei Ländern «en» (en Svizra). Viele Orte haben eigene romanische Namen.`,
v:`Danunder es ti? = Woher kommst du?
Jau sun da … = Ich komme aus …
abitar = wohnen
Nua abitas ti? = Wo wohnst du?
Turitg = Zürich
Cuira = Chur
la Svizra = die Schweiz
il Grischun = Graubünden
il vitg = das Dorf
la citad = die Stadt`,
s:`Jau sun da Turitg. = Ich komme aus Zürich.
Jau abit a Cuira. = Ich wohne in Chur.
Ella abita en in vitg. = Sie wohnt in einem Dorf.
Il Grischun è en Svizra. = Graubünden liegt in der Schweiz.`,
d:`A: Danunder es ti? = Woher kommst du?
B: Jau sun da Turitg. E ti? = Ich komme aus Zürich. Und du?
A: Jau sun da Mustér, ma jau abit a Cuira. = Ich komme aus Disentis, aber ich wohne in Chur.
B: Cuira è bella! = Chur ist schön!
A: Gea! E ti, nua abitas ti? = Ja! Und du, wo wohnst du?
B: Uss abit jau era a Cuira. = Jetzt wohne ich auch in Chur.`,
tip:`Ortsnamen: Mustér = Disentis, Tavau = Davos, Tusan = Thusis, Glion = Ilanz, San Murezzan = St. Moritz. Beachte: «Uss abit jau» – das Verb steht an zweiter Stelle.`},

{id:4,m:'A',cat:'Alltag',t:'Wie geht es dir?',who:'A=Ursina,B=Reto',
intro:`Nach dem Befinden fragen und antworten – eine der häufigsten Situationen im Alltag und bei Arbeitsbeginn.`,
v:`Co stas? = Wie geht es dir?
Co vai? = Wie geht's?
bain = gut
fitg bain = sehr gut
betg mal = nicht schlecht
mal = schlecht
stanchel / stancla = müde (m / f)
malsaun / malsauna = krank (m / f)
cuntent / cuntenta = zufrieden (m / f)`,
s:`Jau stun bain, grazia. = Mir geht es gut, danke.
Oz sun jau stanchel. = Heute bin ich müde.
Co stais Vus? = Wie geht es Ihnen?
Ella è malsauna. = Sie ist krank.`,
d:`A: Bun di, Reto! Co stas? = Guten Tag, Reto! Wie geht es dir?
B: Betg mal, ma jau sun in pau stanchel. = Nicht schlecht, aber ich bin ein bisschen müde.
A: Has ti lavurà la notg? = Hast du in der Nacht gearbeitet?
B: Gea, jau hai gì servetsch da notg. = Ja, ich hatte Nachtdienst.
A: Alura pos ti ir a durmir! = Dann kannst du schlafen gehen!
B: Gea, grazia. A pli tard! = Ja, danke. Bis später!`,
tip:`Adjektive passen sich an: stanchel (m) – stancla (f). Höflichkeitsform: «Vus» mit Verb in der 2. Person Plural (Co stais Vus?).`},

{id:5,m:'A',cat:'Alltag',t:'Zahlen und Uhrzeiten',who:'A=Reisender,B=Passantin',
intro:`Zahlen brauchst du überall: Uhrzeiten, Zugnummern, Gleise, Preise. «in» und «dus» haben eine weibliche Form: «ina» und «duas».`,
v:`in / ina = eins (m / f)
dus / duas = zwei (m / f)
trais = drei
quatter = vier
tschintg = fünf
sis = sechs
set = sieben
otg = acht
nov = neun
diesch = zehn`,
s:`Il tren parta a las otg. = Der Zug fährt um acht Uhr ab.
Jau hai dus frars. = Ich habe zwei Brüder.
Ina minuta, per plaschair! = Eine Minute, bitte!
Tge ura èsi? – Las nov. = Wie spät ist es? – Neun Uhr.`,
d:`A: Perstgisai, tge ura èsi? = Entschuldigung, wie spät ist es?
B: Las otg. = Acht Uhr.
A: Grazia! Cura parta il bus? = Danke! Wann fährt der Bus?
B: A las otg e diesch. = Um acht Uhr zehn.
A: Alura hai jau anc diesch minutas. = Dann habe ich noch zehn Minuten.`,
tip:`Weitere Zahlen: indesch 11, dudesch 12, quindesch 15, ventg 20, trenta 30, quaranta 40, tschuncanta 50. Uhrzeit: «a las otg» = um acht Uhr.`},

{id:6,m:'A',cat:'Alltag',t:'Wochentage und Termine',who:'A=Flurina,B=Andri',
intro:`Wochentage, «heute», «morgen» und «gestern» – damit kannst du Termine vereinbaren und über Dienstpläne sprechen.`,
v:`glindesdi = Montag
mardi = Dienstag
mesemna = Mittwoch
gievgia = Donnerstag
venderdi = Freitag
sonda = Samstag
dumengia = Sonntag
oz = heute
damaun = morgen
ier = gestern`,
s:`Oz è glindesdi. = Heute ist Montag.
Damaun hai jau liber. = Morgen habe ich frei.
La sonda giug jau ballape. = Am Samstag spiele ich Fussball.
Nus ans vesain mesemna. = Wir sehen uns am Mittwoch.`,
d:`A: Has ti temp gievgia? = Hast du am Donnerstag Zeit?
B: Na, gievgia lavur jau. Ma venderdi hai jau liber. = Nein, am Donnerstag arbeite ich. Aber am Freitag habe ich frei.
A: Bun, alura venderdi a las sis? = Gut, dann Freitag um sechs?
B: Gea, perfetg! = Ja, perfekt!
A: A revair venderdi! = Auf Wiedersehen am Freitag!`,
tip:`Wochentage stehen ohne Präposition: «gievgia lavur jau» = am Donnerstag arbeite ich. Mit Artikel (la sonda) bedeutet es «jeweils am Samstag».`},

{id:7,m:'A',cat:'Alltag',t:'Auf der Strasse',who:'A=Touristin,B=Einheimischer',
intro:`Nach dem Weg fragen und Wegbeschreibungen verstehen. Gegenüber Unbekannten verwendet man die Höflichkeitsform «Vus».`,
v:`la via = die Strasse
nua = wo
a dretga = rechts
a sanestra = links
adina dretg ora = immer geradeaus
la staziun = der Bahnhof
la posta = die Post
lunsch = weit
datiers = nah
Perstgisai! = Entschuldigen Sie!`,
s:`Nua è la staziun? = Wo ist der Bahnhof?
Giai a dretga. = Gehen Sie nach rechts.
La posta è datiers. = Die Post ist nah.
Igl è betg lunsch. = Es ist nicht weit.`,
d:`A: Perstgisai, nua è la staziun? = Entschuldigen Sie, wo ist der Bahnhof?
B: Giai adina dretg ora e lura a sanestra. = Gehen Sie immer geradeaus und dann nach links.
A: È quai lunsch? = Ist das weit?
B: Na, tschintg minutas a pe. = Nein, fünf Minuten zu Fuss.
A: Grazia fitg! = Vielen Dank!
B: Gugent! = Gern geschehen!`,
tip:`«Giai!» ist die Befehlsform von «ir» (gehen) für «Vus»/«vus». «Perstgisa!» sagt man zu einer Person, die man duzt.`},

{id:8,m:'A',cat:'Alltag',t:'Einkaufen',who:'A=Verkäuferin,B=Kunde',
intro:`Im Laden etwas verlangen, nach dem Preis fragen und bezahlen. «Jau vuless …» (ich möchte …) ist die höfliche Wunschform.`,
v:`la butia = der Laden
cumprar = kaufen
Quant custa quai? = Wie viel kostet das?
il franc = der Franken
char = teuer
bunmartgà = günstig
il paun = das Brot
il chaschiel = der Käse
il latg = die Milch`,
s:`Jau vuless in paun, per plaschair. = Ich möchte ein Brot, bitte.
Quant custa il chaschiel? = Wie viel kostet der Käse?
Quai custa set francs. = Das kostet sieben Franken.
Quai è memia char. = Das ist zu teuer.`,
d:`A: Bun di! Tge vulais Vus? = Guten Tag! Was möchten Sie?
B: Jau vuless in paun ed in toc chaschiel. = Ich möchte ein Brot und ein Stück Käse.
A: Anc insatge? = Noch etwas?
B: Na, grazia. Quant custa quai? = Nein, danke. Wie viel kostet das?
A: Indesch francs, per plaschair. = Elf Franken, bitte.
B: Qua, grazia. Adia! = Hier, danke. Tschüss!`,
tip:`Vor Vokal wird «e» (und) zu «ed»: «in paun ed in toc chaschiel».`},

{id:9,m:'A',cat:'Alltag',t:'Restaurant und Essen',who:'A=Kellner,B=Gast',
intro:`Bestellen, nach Empfehlungen fragen und die Rechnung verlangen. Capuns sind ein typisches Bündner Gericht.`,
v:`il restaurant = das Restaurant
la carta = die Speisekarte
il café = der Kaffee
l'aua = das Wasser
il gentar = das Mittagessen
la tschaina = das Abendessen
il quint = die Rechnung
mangiar = essen
baiver = trinken
bun / buna = gut / lecker`,
s:`Jau vuless in café, per plaschair. = Ich möchte einen Kaffee, bitte.
Il quint, per plaschair! = Die Rechnung, bitte!
Tge mangias ti? = Was isst du?
Ils capuns èn fitg buns. = Die Capuns sind sehr gut.`,
d:`A: Buna saira! Qua è la carta. = Guten Abend! Hier ist die Speisekarte.
B: Grazia. Tge è bun oz? = Danke. Was ist heute gut?
A: Ils capuns èn fitg buns. = Die Capuns sind sehr gut.
B: Alura prend jau ils capuns ed in'aua. = Dann nehme ich die Capuns und ein Wasser.
A: Fitg bain. = Sehr gut.
B: E pli tard il quint, per plaschair. = Und später die Rechnung, bitte.`,
tip:`«in'aua» – vor Vokal wird «ina» zu «in'». «èn» ist die Mehrzahlform von «esser» (sie sind).`},

{id:10,m:'A',cat:'Alltag',t:'Hobbys und Freizeit',who:'A=Sandra,B=Mauro',
intro:`Über Freizeit und Hobbys sprechen. Mit «gugent» (gern) drückst du aus, was du gern machst.`,
v:`il temp liber = die Freizeit
gugent = gern
leger = lesen
chantar = singen
cuschinar = kochen
ir a spass = spazieren gehen
ir cun skis = Ski fahren
la musica = die Musik
giugar = spielen`,
s:`Tge fas ti gugent? = Was machst du gern?
Jau leg gugent. = Ich lese gern.
La dumengia vom jau a spass. = Am Sonntag gehe ich spazieren.
Ella chanta en in chor. = Sie singt in einem Chor.`,
d:`A: Tge fas ti en tes temp liber? = Was machst du in deiner Freizeit?
B: Jau giug ballape e jau chant en in chor. E ti? = Ich spiele Fussball und singe in einem Chor. Und du?
A: Jau vom gugent cun skis. = Ich fahre gern Ski.
B: Era jau! Giain ensemen sonda? = Ich auch! Gehen wir am Samstag zusammen?
A: Gea, buna idea! = Ja, gute Idee!`,
tip:`«gugent» steht nach dem Verb: «Jau leg gugent» = ich lese gern.`},

{id:11,m:'A',cat:'Alltag',t:'Freunde und Familie',who:'A=Lea,B=Curdin',
intro:`Familie und Freunde vorstellen. Besitzwörter: mes/mia (mein/meine), tes/tia (dein/deine).`,
v:`la famiglia = die Familie
il bab = der Vater
la mamma = die Mutter
il frar = der Bruder
la sora = die Schwester
l'amitg = der Freund
l'amia = die Freundin
ils geniturs = die Eltern
ils uffants = die Kinder
ils fragliuns = die Geschwister`,
s:`Jau hai ina sora ed in frar. = Ich habe eine Schwester und einen Bruder.
Mes bab lavura tar la viafier. = Mein Vater arbeitet bei der Bahn.
Mia amia abita a Basilea. = Meine Freundin wohnt in Basel.
Has ti uffants? = Hast du Kinder?`,
d:`A: Has ti fragliuns? = Hast du Geschwister?
B: Gea, in frar. El ha num Andri. = Ja, einen Bruder. Er heisst Andri.
A: Tge fa el? = Was macht er?
B: El lavura tar la Viafier retica. = Er arbeitet bei der Rhätischen Bahn.
A: Interessant! E tes geniturs? = Interessant! Und deine Eltern?
B: Els abitan a Tusan. = Sie wohnen in Thusis.`,
tip:`mes bab (m) – mia mamma (f) – mes geniturs (Mehrzahl). «tar» = bei: «tar la viafier» = bei der Bahn.`},

{id:12,m:'A',cat:'Kommunikation',t:'Einfache Gespräche führen',who:'A=Gianna,B=Tim',
intro:`Gesprächsstrategien: nachfragen, um Wiederholung bitten, sagen, dass man nicht versteht. Diese Sätze sind auch im Beruf sehr wichtig.`,
v:`Plaidas ti rumantsch? = Sprichst du Romanisch?
in pau = ein bisschen
Jau na chapesch betg. = Ich verstehe nicht.
plaun = langsam
repeter = wiederholen
Tge vul quai dir? = Was bedeutet das?
gea = ja
na = nein
forsa = vielleicht`,
s:`Jau plaid in pau rumantsch. = Ich spreche ein bisschen Romanisch.
Pli plaun, per plaschair. = Langsamer, bitte.
Pos ti repeter? = Kannst du wiederholen?
Tge vul dir «retard»? = Was bedeutet «retard»?`,
d:`A: Tge fas ti oz? = Was machst du heute?
B: Jau vom a la lavur. E ti? = Ich gehe zur Arbeit. Und du?
A: Jau hai liber. Plaidas ti rumantsch cun tes collegas? = Ich habe frei. Sprichst du Romanisch mit deinen Kollegen?
B: Gea, in pau. Ma jau na chapesch betg tut. = Ja, ein bisschen. Aber ich verstehe nicht alles.
A: Quai vegn! A damaun! = Das kommt schon! Bis morgen!
B: A damaun! = Bis morgen!`,
tip:`Verneinung: «na … betg» umschliesst das Verb: «Jau na chapesch betg». Vor Vokal wird «na» zu «n'»: «Jau n'hai betg temp».`},

/* ---------------- MODUL B1 – EISENBAHNGRUNDLAGEN ---------------- */
{id:13,m:'B',sec:'B1',cat:'Eisenbahn',t:'Die Eisenbahn und ihre Begriffe',who:'A=Nachbarin,B=Flurin (ZVL)',
intro:`Grundwortschatz rund um die Bahn. «Viafier» bedeutet wörtlich «Eisenweg» – daher «Viafier retica» für die Rhätische Bahn.`,
v:`la viafier = die Eisenbahn
il tren = der Zug
la locomotiva = die Lokomotive
!il tren automotor = der Triebzug
il vagun = der Wagen
la lingia = die Linie / Strecke
il manaschi = der Betrieb
il traffic = der Verkehr
!il manader dal traffic da trens = der Zugverkehrsleiter (ZVL)`,
s:`La Viafier retica è la viafier dal Grischun. = Die Rhätische Bahn ist die Bahn Graubündens.
Il tren ha tschintg vaguns. = Der Zug hat fünf Wagen.
Il manaschi cumenza a las tschintg. = Der Betrieb beginnt um fünf Uhr.
Sin questa lingia circuleschan blers trens. = Auf dieser Strecke verkehren viele Züge.`,
d:`A: Lavuras ti tar la viafier? = Arbeitest du bei der Bahn?
B: Gea, jau sun manader dal traffic da trens. = Ja, ich bin Zugverkehrsleiter.
A: Tge fas ti exactamain? = Was machst du genau?
B: Nus survegliain il traffic sin las lingias. = Wir überwachen den Verkehr auf den Strecken.
A: Quai è segir interessant! = Das ist sicher interessant!
B: Gea, mintga di è different. = Ja, jeder Tag ist anders.`,
tip:`Mehrzahl mit -s: il tren → ils trens, il vagun → ils vaguns. Die Berufsbezeichnung für ZVL ist als ungeprüft markiert – bitte intern verifizieren.`},

{id:14,m:'B',sec:'B1',cat:'Bahnhof',t:'Bahnhof, Gleise und Perrons',who:'A=Reisende,B=Bahnpersonal',
intro:`Am Bahnhof: Gleis, Billett, Schalter, Ausgang. Gleisangaben lauten «da binari …» (ab Gleis …).`,
v:`la staziun = der Bahnhof
il binari = das Gleis
!il perrun = der Perron
il bigliet = das Billett
il sportel = der Schalter
la sortida = der Ausgang
l'entrada = der Eingang
punctual = pünktlich`,
s:`Il tren parta da binari trais. = Der Zug fährt ab Gleis 3.
Nua è il sportel? = Wo ist der Schalter?
Il bigliet custa ventg francs. = Das Billett kostet zwanzig Franken.
La sortida è a sanestra. = Der Ausgang ist links.`,
d:`A: Perstgisai, da tge binari parta il tren per Tavau? = Entschuldigung, ab welchem Gleis fährt der Zug nach Davos?
B: Da binari quatter. = Ab Gleis 4.
A: Ed è il tren punctual? = Und ist der Zug pünktlich?
B: Gea, el parta a las nov e ventg. = Ja, er fährt um 9.20 Uhr ab.
A: Grazia fitg! = Vielen Dank!`,
tip:`«per» bei Zielen: «il tren per Tavau» = der Zug nach Davos. «da» bei Herkunft/Ausgangspunkt: «da binari quatter».`},

{id:15,m:'B',sec:'B1',cat:'Eisenbahn',t:'Züge und Zugtypen',who:'A=Andrea (ZVL),B=Marco (ZVL)',
intro:`Verschiedene Zugarten und Eigenschaften von Zügen. Viele Fachbezeichnungen sind regional unterschiedlich – unsichere Begriffe sind markiert.`,
v:`il tren regiunal = der Regionalzug
!il tren da marchanzia = der Güterzug
!il tren special = der Extrazug
la classa = die Klasse
lung / lunga = lang
curt / curta = kurz
plain / plaina = voll
vid / vida = leer`,
s:`Il tren regiunal sa ferma en mintga staziun. = Der Regionalzug hält an jedem Bahnhof.
Il tren da marchanzia è fitg lung. = Der Güterzug ist sehr lang.
Oz è il tren plain. = Heute ist der Zug voll.
Quest tren ha in vagun da l'emprima classa. = Dieser Zug hat einen Wagen der ersten Klasse.`,
d:`A: Tge tren è quai? = Welcher Zug ist das?
B: Quai è il tren regiunal 1234 da Cuira. = Das ist der Regionalzug 1234 aus Chur.
A: E suenter? = Und danach?
B: Suenter vegn in tren da marchanzia. = Danach kommt ein Güterzug.
A: Bun, jau hai chapì. = Gut, ich habe verstanden.`,
tip:`«Jau hai chapì» (ich habe verstanden) ist im Betrieb einer der wichtigsten Sätze überhaupt.`},

{id:16,m:'B',sec:'B1',cat:'Eisenbahn',t:'Signale und Weichen',who:'A=Ausbildner,B=Lernende',
intro:`Sprachübung zu Signalen und Farben. Achtung: Dies sind vereinfachte Sprachbeispiele, keine echten Signalbegriffe oder Betriebsvorschriften.`,
v:`il signal = das Signal
cotschen / cotschna = rot
verd / verda = grün
mellen / mellna = gelb
!il scambi = die Weiche
fermar = anhalten
cuntinuar = weiterfahren / fortsetzen
la posiziun = die Stellung / Position
!la cruschada = die Kreuzung`,
s:`Il signal è cotschen. = Das Signal ist rot.
Il tren sto fermar. = Der Zug muss anhalten.
Uss è il signal verd. = Jetzt ist das Signal grün.
Il scambi è en la dretga posiziun. = Die Weiche ist in der richtigen Stellung.`,
d:`A: Tge vesas ti? = Was siehst du?
B: Il signal è anc cotschen. = Das Signal ist noch rot.
A: Bun, nus spetgain. = Gut, wir warten.
B: Uss è el verd. = Jetzt ist es grün.
A: Perfetg, nus pudain cuntinuar. = Perfekt, wir können weiterfahren.`,
tip:`Farbadjektive stehen nach dem Nomen und passen sich an: il signal cotschen, la glisch cotschna.`},

{id:17,m:'B',sec:'B1',cat:'Eisenbahn',t:'Fahrplan und Zugnummern',who:'A=Andrea (ZVL),B=Marco (ZVL)',
intro:`Fahrplan, Abfahrt, Ankunft und Zugnummern. Zugnummern werden im Betrieb oft Ziffer für Ziffer gesprochen, um Verwechslungen zu vermeiden.`,
v:`l'urari = der Fahrplan
il numer = die Nummer
la partenza = die Abfahrt
l'arrivada = die Ankunft
il retard = die Verspätung
tenor urari = gemäss Fahrplan
!la colliaziun = der Anschluss / die Verbindung
cura = wann`,
s:`La partenza dal tren 1234 è a las set. = Die Abfahrt des Zuges 1234 ist um sieben Uhr.
L'arrivada a Cuira è a las otg. = Die Ankunft in Chur ist um acht Uhr.
Il tren è punctual. = Der Zug ist pünktlich.
Tenor urari arriva il tren a las nov. = Gemäss Fahrplan kommt der Zug um neun Uhr an.`,
d:`A: Tge numer ha il tren? = Welche Nummer hat der Zug?
B: Il tren ha il numer 1137. = Der Zug hat die Nummer 1137.
A: E cura è l'arrivada tenor urari? = Und wann ist die Ankunft gemäss Fahrplan?
B: A las diesch e tschintg. = Um 10.05 Uhr.
A: Ed è el punctual? = Und ist er pünktlich?
B: Na, el ha tschintg minutas retard. = Nein, er hat fünf Minuten Verspätung.`,
tip:`1137 Ziffer für Ziffer: «in – in – trais – set». «dal» = da + il (des / vom).`},

/* ---------------- MODUL B2 – KOMMUNIKATION ALS ZVL ---------------- */
{id:18,m:'B',sec:'B2',cat:'Zugverkehrsleitung',t:'Die Arbeit als Zugverkehrsleiter',who:'A=Ladina (ZVL),B=Flurin (neu)',
intro:`Der Arbeitsalltag in der Leitstelle: Dienst, Überwachung, Koordination, Sicherheit. Ein neuer Kollege beginnt seinen ersten Tag.`,
v:`!la centrala = die Leitstelle / Zentrale
il servetsch = der Dienst
la lavur = die Arbeit
survegliar = überwachen
coordinar = koordinieren
la segirezza = die Sicherheit
la communicaziun = die Kommunikation
il collega / la collega = der Kollege / die Kollegin
impurtant = wichtig`,
s:`Jau lavur en la centrala. = Ich arbeite in der Leitstelle.
Mes servetsch cumenza a las sis. = Mein Dienst beginnt um sechs Uhr.
La segirezza è il pli impurtant. = Die Sicherheit ist das Wichtigste.
Nus coordinain ils trens sin la lingia. = Wir koordinieren die Züge auf der Strecke.`,
d:`A: Allegra! Es ti il nov collega? = Hallo! Bist du der neue Kollege?
B: Gea, jau hai num Flurin. Oz è mes emprim di. = Ja, ich heisse Flurin. Heute ist mein erster Tag.
A: Bainvegni! Nus survegliain las lingias dal Grischun. = Willkommen! Wir überwachen die Strecken Graubündens.
B: Tge è il pli impurtant? = Was ist das Wichtigste?
A: La segirezza e la communicaziun clera. = Die Sicherheit und die klare Kommunikation.
B: Jau hai chapì. = Ich habe verstanden.`,
tip:`Verben auf -ar, Mehrzahl «nus»: -ain (nus survegliain, nus coordinain). «il pli impurtant» = das Wichtigste.`},

{id:19,m:'B',sec:'B2',cat:'Zugverkehrsleitung',t:'Kommunikation mit dem Lokpersonal',who:'A=Leitstelle,B=Lokführerin',
intro:`Gespräch zwischen Leitstelle und Lokpersonal: sich melden, Verbindung prüfen, nachfragen, bestätigen. (Fiktive Sprachübung, keine Betriebsvorschrift.)`,
v:`!il macchinist / la macchinista = der Lokführer / die Lokführerin
Qua è … = Hier ist …
Udis Vus? = Hören Sie (mich)?
Jau aud bain. = Ich höre gut.
Tge è capità? = Was ist passiert?
en urden = in Ordnung
la porta = die Tür
funcziunar = funktionieren`,
s:`Qua è la centrala. Udis Vus? = Hier ist die Leitstelle. Hören Sie?
Pudais Vus repeter, per plaschair? = Können Sie bitte wiederholen?
Tut è en urden. = Alles ist in Ordnung.
La porta na funcziuna betg. = Die Tür funktioniert nicht.`,
d:`A: Tren 1234, qua è la centrala. Udis Vus? = Zug 1234, hier ist die Leitstelle. Hören Sie?
B: Gea, jau aud bain. = Ja, ich höre gut.
A: Vus avais tschintg minutas retard. Tge è capità? = Sie haben fünf Minuten Verspätung. Was ist passiert?
B: Ina porta n'ha betg funcziunà a Landquart. = Eine Tür hat in Landquart nicht funktioniert.
A: Jau hai chapì: problem cun ina porta. Uss è tut en urden? = Verstanden: Problem mit einer Tür. Ist jetzt alles in Ordnung?
B: Gea, tut en urden. = Ja, alles in Ordnung.
A: Grazia, a pli tard. = Danke, bis später.`,
tip:`Gute Funk-/Telefonpraxis: Information wiederholen («Jau hai chapì: …»). So werden Missverständnisse sofort sichtbar.`},

{id:20,m:'B',sec:'B2',cat:'Zugverkehrsleitung',t:'Kommunikation zwischen zwei ZVL',who:'A=Andrea (Cuira),B=Marco (Tavau)',
intro:`Zwei Zugverkehrsleiter in benachbarten Bereichen tauschen sich aus. Typisch: sich mit Ort und Namen melden, Information geben, Grund nennen, bestätigen.`,
v:`la zona = der Bereich / die Zone
vischin / vischina = benachbart
l'infurmaziun = die Information
infurmar = informieren
d'accord = einverstanden
pertge = warum
tecnic / tecnica = technisch
il problem = das Problem`,
s:`Qua è Andrea a Cuira. = Hier ist Andrea in Chur.
Jau hai ina infurmaziun per tai. = Ich habe eine Information für dich.
Il tren vegn en tia zona en tschintg minutas. = Der Zug kommt in fünf Minuten in deinen Bereich.
D'accord, grazia per l'infurmaziun. = Einverstanden, danke für die Information.`,
d:`A: Allegra, qua è Andrea a Cuira. = Hallo, hier ist Andrea in Chur.
B: Allegra Andrea, qua è Marco a Tavau. = Hallo Andrea, hier ist Marco in Davos.
A: Il tren 1137 ha diesch minutas retard. = Der Zug 1137 hat zehn Minuten Verspätung.
B: Diesch minutas? Pertge? = Zehn Minuten? Warum?
A: In problem tecnic a Landquart. = Ein technisches Problem in Landquart.
B: D'accord, grazia per l'infurmaziun. = Einverstanden, danke für die Information.`,
tip:`Unter Kollegen duzt man sich meist: «per tai» (für dich), «tia zona» (dein Bereich).`},

{id:21,m:'B',sec:'B2',cat:'Zugverkehrsleitung',t:'Eine Zugfahrt koordinieren',who:'A=Ladina (ZVL),B=Gion (ZVL)',
intro:`Reihenfolge von Zügen absprechen: zuerst, danach, warten lassen. Sprachlich geht es um Abfolge und Planung.`,
v:`emprim = zuerst
suenter = danach
spetgar = warten
passar = durchfahren / passieren
il plan = der Plan
circa = ungefähr
!la precedenza = der Vortritt / die Priorität
correct = richtig`,
s:`Emprim passa il tren regiunal. = Zuerst fährt der Regionalzug durch.
Suenter parta il tren da marchanzia. = Danach fährt der Güterzug ab.
Il tren 1234 spetga a Landquart. = Der Zug 1234 wartet in Landquart.
Il tren regiunal ha la precedenza. = Der Regionalzug hat Vortritt.`,
d:`A: Co faschain nus cun ils dus trens? = Wie machen wir es mit den zwei Zügen?
B: Emprim passa il tren regiunal, suenter il tren da marchanzia. = Zuerst fährt der Regionalzug, danach der Güterzug.
A: Sto il tren da marchanzia spetgar? = Muss der Güterzug warten?
B: Gea, el spetga circa tschintg minutas. = Ja, er wartet ungefähr fünf Minuten.
A: Bun, quai è il plan. = Gut, das ist der Plan.
B: Correct. = Richtig.`,
tip:`Nach «emprim» und «suenter» folgt das Verb direkt (Verb an 2. Stelle): «Emprim passa il tren».`},

{id:22,m:'B',sec:'B2',cat:'Zugverkehrsleitung',t:'Verspätungen kommunizieren',who:'A=Andrea (ZVL),B=Marco (ZVL)',
intro:`Verspätungen melden, nach Dauer und Grund fragen. Diese Situation ist der Kern vieler ZVL-Gespräche.`,
v:`il retard = die Verspätung
en retard = verspätet
Quant è il retard? = Wie gross ist die Verspätung?
il motiv = der Grund
augmentar = zunehmen / steigen
diminuir = abnehmen
actual = aktuell
avant = vor (Ort/Zeit)`,
s:`Il tren ha diesch minutas retard. = Der Zug hat zehn Minuten Verspätung.
Il tren è en retard. = Der Zug ist verspätet.
Il retard augmenta. = Die Verspätung nimmt zu.
Tge è il motiv dal retard? = Was ist der Grund der Verspätung?`,
d:`A: Allegra! Il tren 1137 è en retard. = Hallo! Der Zug 1137 ist verspätet.
B: Quant è il retard? = Wie gross ist die Verspätung?
A: Diesch minutas. = Zehn Minuten.
B: E tge è il motiv? = Und was ist der Grund?
A: In tren da marchanzia avant el. = Ein Güterzug vor ihm.
B: D'accord, jau infurmesch las staziuns. = Einverstanden, ich informiere die Bahnhöfe.`,
tip:`Zwei Möglichkeiten: «Il tren ha diesch minutas retard» oder «Il tren è en retard». «jau infurmesch» – manche Verben haben in der Einzahl die Endung -esch.`},

{id:23,m:'B',sec:'B2',cat:'Zugverkehrsleitung',t:'Störungen im Bahnbetrieb',who:'A=Techniker,B=Leitstelle',
intro:`Eine technische Störung melden und Informationen austauschen: Was, wo, wie lange? (Fiktive Übungssituation.)`,
v:`!la disturbanza = die Störung
I dat … = Es gibt …
reparar = reparieren
la reparatura = die Reparatur
!il tecnicher = der Techniker
quant ditg = wie lange
durar = dauern
urgent = dringend
en viadi = unterwegs`,
s:`I dat ina disturbanza a Landquart. = Es gibt eine Störung in Landquart.
Il signal na funcziuna betg. = Das Signal funktioniert nicht.
Il tecnicher è en viadi. = Der Techniker ist unterwegs.
Quant ditg dura la reparatura? = Wie lange dauert die Reparatur?`,
d:`A: Centrala, jau hai in problem. = Leitstelle, ich habe ein Problem.
B: Tge è capità? = Was ist passiert?
A: I dat ina disturbanza tecnica a Landquart. = Es gibt eine technische Störung in Landquart.
B: Quant ditg dura quai? = Wie lange dauert das?
A: Circa trenta minutas. = Ungefähr dreissig Minuten.
B: D'accord, jau infurmesch ils trens. = Einverstanden, ich informiere die Züge.`,
tip:`«I dat» = es gibt (wörtlich: es gibt/gibt es). Frage: «Quant ditg …?» = Wie lange …?`},

{id:24,m:'B',sec:'B2',cat:'Zugverkehrsleitung',t:'Gleisänderungen und Umleitungen',who:'A=Ladina (ZVL),B=Ursina (Bahnhof)',
intro:`Ein Zug kann nicht auf dem geplanten Gleis einfahren. Du erklärst die Änderung und das neue Gleis.`,
v:`entrar = einfahren / hineingehen
occupà / occupada = besetzt
liber / libra = frei
midar = ändern / wechseln
la midada = die Änderung
!la deviaziun = die Umleitung
auter / autra = anderer / andere
via = über (Ort)`,
s:`Il tren na po betg entrar sin binari dus. = Der Zug kann nicht auf Gleis 2 einfahren.
Binari dus è occupà. = Gleis 2 ist besetzt.
Il tren entra sin binari trais. = Der Zug fährt auf Gleis 3 ein.
Il tren va via Tusan. = Der Zug fährt über Thusis.`,
d:`A: Il tren 1234 na po betg entrar sin binari dus. = Der Zug 1234 kann nicht auf Gleis 2 einfahren.
B: Pertge betg? = Warum nicht?
A: Binari dus è anc occupà. = Gleis 2 ist noch besetzt.
B: Tge binari è liber? = Welches Gleis ist frei?
A: Binari trais. = Gleis 3.
B: D'accord, jau infurmesch ils viagiaturs. = Einverstanden, ich informiere die Reisenden.`,
tip:`«na po betg» = kann nicht. Modalverb «pudair» (können): jau poss, ti pos, el po, nus pudain, vus pudais, els pon.`},

{id:25,m:'B',sec:'B2',cat:'Zugverkehrsleitung',t:'Anschlussverbindungen',who:'A=Andrea (ZVL),B=Gion (ZVL)',
intro:`Ein Anschlusszug soll auf einen verspäteten Zug warten. Ihr besprecht, ob das möglich ist.`,
v:`midar tren = umsteigen
!il tren da colliaziun = der Anschlusszug
il viagiatur / la viagiatura = der / die Reisende
perder = verpassen / verlieren
garantir = sichern / garantieren
ponderar = abwägen
blers / blras = viele
fin = bis`,
s:`Il tren da colliaziun spetga. = Der Anschlusszug wartet.
Ils viagiaturs ston midar tren a Cuira. = Die Reisenden müssen in Chur umsteigen.
Senza spetgar perdan els il tren. = Ohne Warten verpassen sie den Zug.
Il tren po spetgar fin tschintg minutas. = Der Zug kann bis zu fünf Minuten warten.`,
d:`A: Il tren da Turitg ha set minutas retard. = Der Zug aus Zürich hat sieben Minuten Verspätung.
B: Ed ils viagiaturs per San Murezzan? = Und die Reisenden nach St. Moritz?
A: Po il tren da colliaziun spetgar? = Kann der Anschlusszug warten?
B: Gea, el po spetgar fin set minutas. = Ja, er kann bis zu sieben Minuten warten.
A: Bun, alura funcziuna la colliaziun. = Gut, dann klappt der Anschluss.`,
tip:`Fragen bildet man durch Umstellen: «Il tren po spetgar.» → «Po il tren spetgar?»`},

{id:26,m:'B',sec:'B2',cat:'Zugverkehrsleitung',t:'Betriebsunterbrechungen',who:'A=Ladina (ZVL),B=Flurin (ZVL)',
intro:`Eine Strecke ist unterbrochen – zum Beispiel wegen einer Lawine. Ihr besprecht Ursache, Dauer und Ersatz.`,
v:`l'interrupziun = die Unterbrechung
serrà / serrada = gesperrt / geschlossen
tranter = zwischen
la lavina = die Lawine
la naiv = der Schnee
probablamain = wahrscheinlich
!il bus substitut = der Ersatzbus
restar = bleiben`,
s:`La lingia è serrada. = Die Strecke ist gesperrt.
I dat ina interrupziun tranter Cuira e Tusan. = Es gibt eine Unterbrechung zwischen Chur und Thusis.
Ina lavina ha serrà la lingia. = Eine Lawine hat die Strecke gesperrt.
Il bus substitut parta a las diesch. = Der Ersatzbus fährt um zehn Uhr ab.`,
d:`A: La lingia tranter Filisur e Bravuogn è serrada. = Die Strecke zwischen Filisur und Bergün ist gesperrt.
B: Tge è capità? = Was ist passiert?
A: Ina lavina. = Eine Lawine.
B: Quant ditg resta la lingia serrada? = Wie lange bleibt die Strecke gesperrt?
A: Probablamain fin la saira. = Wahrscheinlich bis zum Abend.
B: D'accord. Nus organisain bus substituts. = Einverstanden. Wir organisieren Ersatzbusse.`,
tip:`Partizip als Adjektiv passt sich an: il binari è serrà – la lingia è serrada.`},

{id:27,m:'B',sec:'B2',cat:'Zugverkehrsleitung',t:'Unregelmässigkeiten im Bahnbetrieb',who:'A=Leitstelle,B=Lokführer',
intro:`Ein Lokführer meldet etwas Ungewöhnliches – zum Beispiel ein Tier auf dem Gleis. Du verstehst, fragst nach und bestätigst.`,
v:`!l'irregularitad = die Unregelmässigkeit
observar = beobachten
la canera = das Geräusch / der Lärm
curius / curiusa = seltsam
l'animal = das Tier
il tschierv = der Hirsch
immediatamain = sofort
l'annunzia = die Meldung`,
s:`Il macchinist ha observà in animal sin il binari. = Der Lokführer hat ein Tier auf dem Gleis beobachtet.
Jau hai udì ina canera curiusa. = Ich habe ein seltsames Geräusch gehört.
Jau infurmesch immediatamain la centrala. = Ich informiere sofort die Leitstelle.
Grazia per l'annunzia. = Danke für die Meldung.`,
d:`B: Centrala, qua è tren 1234. Jau hai vis in tschierv sin il binari. = Leitstelle, hier ist Zug 1234. Ich habe einen Hirsch auf dem Gleis gesehen.
A: Avais Vus stuì fermar? = Mussten Sie anhalten?
B: Gea, ma uss è il binari liber. = Ja, aber jetzt ist das Gleis frei.
A: Jau hai chapì. Tut en urden cun il tren? = Verstanden. Alles in Ordnung mit dem Zug?
B: Gea, tut en urden. = Ja, alles in Ordnung.
A: Grazia per l'annunzia. = Danke für die Meldung.`,
tip:`Perfekt: avair + Partizip: «Jau hai vis» (gesehen), «Jau hai udì» (gehört), «Avais Vus stuì?» (mussten Sie?).`},

/* ---------------- MODUL B4 – KOMMUNIKATION MIT REISENDEN ---------------- */
{id:28,m:'B',sec:'B4',cat:'Bahnhof',t:'Auskünfte am Bahnhof',who:'A=Reisende,B=Bahnpersonal',
intro:`Reisende nach Abfahrt, Gleis und Direktverbindung informieren – freundlich und in der Höflichkeitsform.`,
v:`il proxim tren = der nächste Zug
la direcziun = die Richtung
directamain = direkt
senza = ohne
il viadi = die Reise
Bun viadi! = Gute Reise!
reservar = reservieren
la plazza = der Platz`,
s:`Cura parta il proxim tren per Cuira? = Wann fährt der nächste Zug nach Chur?
Il proxim tren parta en diesch minutas. = Der nächste Zug fährt in zehn Minuten.
Quest tren va directamain a San Murezzan. = Dieser Zug fährt direkt nach St. Moritz.
Stoss jau reservar ina plazza? = Muss ich einen Platz reservieren?`,
d:`A: Perstgisai, cura parta il proxim tren per Cuira? = Entschuldigung, wann fährt der nächste Zug nach Chur?
B: En diesch minutas, da binari in. = In zehn Minuten, ab Gleis 1.
A: Va el directamain? = Fährt er direkt?
B: Gea, senza midar. = Ja, ohne Umsteigen.
A: Grazia fitg! = Vielen Dank!
B: Bun viadi! = Gute Reise!`,
tip:`«en diesch minutas» = in zehn Minuten (Zeitspanne). «a las diesch» = um zehn Uhr (Zeitpunkt).`},

{id:29,m:'B',sec:'B4',cat:'Bahnhof',t:'Verspätungen erklären',who:'A=Reisender,B=Bahnpersonal',
intro:`Reisenden eine Verspätung erklären, sich entschuldigen und für Geduld danken.`,
v:`Nus ans excusain. = Wir entschuldigen uns.
la pazienza = die Geduld
Grazia per Vossa pazienza. = Danke für Ihre Geduld.
quindesch = fünfzehn
ventg = zwanzig
uss = jetzt
anc = noch
gia = schon`,
s:`Il tren ha quindesch minutas retard. = Der Zug hat fünfzehn Minuten Verspätung.
Nus ans excusain per il retard. = Wir entschuldigen uns für die Verspätung.
L'arrivada tenor urari è a las nov. = Die fahrplanmässige Ankunft ist um neun Uhr.
Grazia per Vossa pazienza. = Danke für Ihre Geduld.`,
d:`A: Pertge è il tren en retard? = Warum ist der Zug verspätet?
B: I dat in problem tecnic a Landquart. = Es gibt ein technisches Problem in Landquart.
A: Quant ditg stoss jau spetgar? = Wie lange muss ich warten?
B: Circa quindesch minutas. Nus ans excusain. = Ungefähr fünfzehn Minuten. Wir entschuldigen uns.
A: Bun, grazia per l'infurmaziun. = Gut, danke für die Information.
B: Grazia per Vossa pazienza. = Danke für Ihre Geduld.`,
tip:`Höfliche Besitzform: «Vossa pazienza» (Ihre Geduld) – gross geschrieben wie «Vus».`},

{id:30,m:'B',sec:'B4',cat:'Bahnhof',t:'Zugausfälle kommunizieren',who:'A=Bahnpersonal,B=Reisende',
intro:`Ein Zug fällt aus. Du informierst über Ersatzbusse und wo sie abfahren.`,
v:`!annullà / annullada = ausgefallen / annulliert
l'alternativa = die Alternative
la fermada = die Haltestelle
davant = vor (Ort)
l'agid = die Hilfe
il bus = der Bus
Tge poss jau far? = Was kann ich tun?
Oh na! = Oh nein!`,
s:`Il tren da las otg è annullà. = Der Zug um acht Uhr fällt aus.
Il bus substitut parta davant la staziun. = Der Ersatzbus fährt vor dem Bahnhof ab.
Nus avain ina alternativa per Vus. = Wir haben eine Alternative für Sie.
La fermada dal bus è a dretga. = Die Bushaltestelle ist rechts.`,
d:`A: Il tren per Glion è annullà. = Der Zug nach Ilanz fällt aus.
B: Oh na! Tge poss jau far? = Oh nein! Was kann ich tun?
A: I dat in bus substitut. = Es gibt einen Ersatzbus.
B: Nua parta il bus? = Wo fährt der Bus ab?
A: Davant la staziun, a las otg e quindesch. = Vor dem Bahnhof, um 8.15 Uhr.
B: Grazia per l'agid! = Danke für die Hilfe!`,
tip:`Das Wort für «ausgefallen» ist als ungeprüft markiert. Im Zweifel: «Il tren na circulescha betg» (der Zug verkehrt nicht).`},

{id:31,m:'B',sec:'B4',cat:'Bahnhof',t:'Alternative Verbindungen erklären',who:'A=Reisender,B=Bahnpersonal',
intro:`Alternative Routen erklären: umsteigen, über einen anderen Ort fahren, auf den nächsten Zug warten.`,
v:`Vus stuais … = Sie müssen …
pli svelt = schneller
la pussaivladad = die Möglichkeit
ubain = oder
enstagl da = anstatt
Claustra = Klosters
prender = nehmen
ina ura = eine Stunde`,
s:`Vus stuais midar tren a Cuira. = Sie müssen in Chur umsteigen.
Il pli svelt è via Landquart. = Am schnellsten ist es über Landquart.
Enstagl da spetgar, pudais Vus prender il bus. = Anstatt zu warten, können Sie den Bus nehmen.
I dat duas pussaivladads. = Es gibt zwei Möglichkeiten.`,
d:`A: Jau stoss ir a Scuol, ma il tren è annullà. = Ich muss nach Scuol, aber der Zug fällt aus.
B: I dat duas pussaivladads. = Es gibt zwei Möglichkeiten.
A: Tge pussaivladads? = Welche Möglichkeiten?
B: Vus pudais ir via Claustra e midar tren là, ubain spetgar il proxim tren en ina ura. = Sie können über Klosters fahren und dort umsteigen, oder in einer Stunde den nächsten Zug nehmen.
A: Tge è pli svelt? = Was ist schneller?
B: Via Claustra. = Über Klosters.
A: Alura vom jau via Claustra. Grazia! = Dann fahre ich über Klosters. Danke!`,
tip:`«stuair» (müssen): jau stoss, ti stos, el sto, nus stuain, vus stuais, els ston.`},

{id:32,m:'B',sec:'B4',cat:'Bahnhof',t:'Reisenden helfen',who:'A=Bahnpersonal,B=Reisender',
intro:`Hilfe anbieten: Lift, Gepäck, verlorene Gegenstände. Freundliche Formulierungen in der Höflichkeitsform.`,
v:`gidar = helfen
Poss jau gidar? = Kann ich helfen?
la valischia = der Koffer
l'ascensur = der Lift
tschertgar = suchen
pers = verloren
il persunal = das Personal
contactar = kontaktieren`,
s:`Poss jau gidar Vus? = Kann ich Ihnen helfen?
L'ascensur è a sanestra. = Der Lift ist links.
Jau hai pers mia valischia. = Ich habe meinen Koffer verloren.
Nus tschertgain Vossa valischia. = Wir suchen Ihren Koffer.`,
d:`A: Perstgisai, poss jau gidar? = Entschuldigung, kann ich helfen?
B: Gea, jau hai pers mia valischia en il tren. = Ja, ich habe meinen Koffer im Zug verloren.
A: En tge tren? = In welchem Zug?
B: En il tren da Tavau, a las nov. = Im Zug aus Davos, um neun Uhr.
A: Nus contactain il persunal dal tren. = Wir kontaktieren das Zugpersonal.
B: Grazia fitg! = Vielen Dank!`,
tip:`«la valischia» ist feminin, darum «mia valischia» (meine) und «Vossa valischia» (Ihre).`},

/* ---------------- MODUL C – FUSSBALL ---------------- */
{id:33,m:'C',cat:'Fussball',t:'Fussballgrundbegriffe',who:'A=Martina,B=Gian',
intro:`Die wichtigsten Wörter rund um Fussball: Ball, Spiel, Tor, Mannschaft, Trainer.`,
v:`il ballape = der Fussball (Sport)
la balla = der Ball
la partida = das Spiel / der Match
il gol = das Tor (Treffer)
la squadra = die Mannschaft
il giugader / la giugadra = der Spieler / die Spielerin
il plaz da ballape = der Fussballplatz
il trenader / la trenadra = der Trainer / die Trainerin
!l'arbiter = der Schiedsrichter`,
s:`Jau giug ballape en ina squadra. = Ich spiele Fussball in einer Mannschaft.
La partida cumenza a las trais. = Das Spiel beginnt um drei Uhr.
Ella ha fatg in gol! = Sie hat ein Tor geschossen!
Il plaz da ballape è davos la scola. = Der Fussballplatz ist hinter der Schule.`,
d:`A: Giugas ti ballape? = Spielst du Fussball?
B: Gea, en la squadra da Cuira. = Ja, in der Mannschaft von Chur.
A: Cura è la proxima partida? = Wann ist das nächste Spiel?
B: Sonda a las trais. = Samstag um drei Uhr.
A: Jau vegn a guardar! = Ich komme zuschauen!`,
tip:`«far in gol» = ein Tor schiessen (wörtlich: ein Tor machen). «ballape» kommt von «balla» (Ball) und «pe» (Fuss).`},

{id:34,m:'C',cat:'Fussball',t:'Positionen auf dem Spielfeld',who:'A=Trainer,B=Gian',
intro:`Spielerpositionen benennen. Mit «sco» (als) sagst du, auf welcher Position jemand spielt.`,
v:`!il portier = der Torhüter
!il defensur = der Verteidiger
!l'attaccant = der Stürmer
la defensiva = die Verteidigung
l'attacca = der Angriff
il center = die Mitte
la vart = die Seite / der Flügel
sco = als / wie
svelt / svelta = schnell`,
s:`Jau giug sco defensur. = Ich spiele als Verteidiger.
Il portier è fitg bun. = Der Torhüter ist sehr gut.
L'attaccant giuga sin la vart dretga. = Der Stürmer spielt auf der rechten Seite.
Nus avain ina buna defensiva. = Wir haben eine gute Verteidigung.`,
d:`A: Gian, oz giugas ti sco attaccant. = Gian, heute spielst du als Stürmer.
B: Sco attaccant? Normalmain giug jau en la defensiva. = Als Stürmer? Normalerweise spiele ich in der Verteidigung.
A: Jau sai, ma ti es svelt. = Ich weiss, aber du bist schnell.
B: D'accord, jau emprov. = Einverstanden, ich versuche es.
A: Bun! Jau hai fidanza en tai. = Gut! Ich vertraue dir.`,
tip:`Positionsbezeichnungen sind teilweise regional verschieden und deshalb als ungeprüft markiert.`},

{id:35,m:'C',cat:'Fussball',t:'Training und Übungen',who:'A=Trainerin,B=Mannschaft',
intro:`Ein Training ansagen: Begrüssung, Einlaufen, Übungen, Pausen. Trainer sprechen die Mannschaft mit «vus» (ihr) an.`,
v:`il trenament = das Training
currer = laufen / rennen
l'exercizi = die Übung
passar = passen / abspielen
tirar = schiessen
la pausa = die Pause
la gruppa = die Gruppe
pront / pronta = bereit
il gir = die Runde`,
s:`Il trenament cumenza a las sis. = Das Training beginnt um sechs Uhr.
Emprim currin nus tschintg minutas. = Zuerst laufen wir fünf Minuten.
Faschai duas gruppas! = Bildet zwei Gruppen!
Uss ina pausa da duas minutas. = Jetzt eine Pause von zwei Minuten.`,
d:`A: Allegra a tuts! Essas vus pronts? = Hallo zusammen! Seid ihr bereit?
B: Gea! = Ja!
A: Emprim currin nus dus girs dal plaz. = Zuerst laufen wir zwei Runden um den Platz.
B: E suenter? = Und danach?
A: Suenter faschain nus in exercizi cun la balla. = Danach machen wir eine Übung mit dem Ball.
B: Bun, giain! = Gut, los geht's!`,
tip:`Verben auf -er: nus currin, vus curris. Befehl an mehrere: «Faschai!» (macht!), «Giai!» (geht!).`},

{id:36,m:'C',cat:'Fussball',t:'Anweisungen als Trainer',who:'A=Trainer,B=Luca',
intro:`Kurze, klare Anweisungen am Spielfeldrand. Die Befehlsform (Imperativ) für «ti» ist oft die blosse Verbform.`,
v:`Passa! = Spiel ab! / Pass!
Tira! = Schiess!
Cur! = Lauf!
Fa attenziun! = Pass auf!
Pli svelt! = Schneller!
Vegni enavos! = Kommt zurück!
enavant = nach vorne
Bravo! = Bravo!
Anc ina giada! = Noch einmal!`,
s:`Passa la balla a Luca! = Spiel den Ball zu Luca!
Cur sin la vart! = Lauf auf die Seite!
Faschai attenziun, tuts! = Passt alle auf!
Anc ina giada, pli svelt! = Noch einmal, schneller!`,
d:`A: Luca, passa la balla! = Luca, spiel den Ball ab!
B: A tgi? = Zu wem?
A: Ad Andri, el è liber! = Zu Andri, er ist frei!
B: Fatg! = Erledigt!
A: Bravo! Ed uss cur enavant! = Bravo! Und jetzt lauf nach vorne!
B: Jau cur! = Ich laufe!`,
tip:`Imperativ ti: passa! tira! cur! – Imperativ vus: passai! tirai! curri!`},

{id:37,m:'C',cat:'Fussball',t:'Während eines Spiels kommunizieren',who:'A=Selina,B=Nina',
intro:`Kommunikation auf dem Platz: warnen, sich anbieten, Zeit ansagen.`,
v:`Attenziun! = Achtung!
davos tai = hinter dir
Jau sun liber! = Ich bin frei!
!marcar = decken
il tir = der Schuss
!il corner = der Eckball
la midada = die Auswechslung
il temp = die Zeit`,
s:`Attenziun, davos tai! = Achtung, hinter dir!
Jau sun libra! = Ich bin frei! (f)
Marca il numer diesch! = Deck die Nummer zehn!
Anc tschintg minutas! = Noch fünf Minuten!`,
d:`A: Attenziun, davos tai! = Achtung, hinter dir!
B: Jau hai vis! = Ich habe es gesehen!
A: Jau sun libra, passa! = Ich bin frei, spiel ab!
B: Qua! = Hier!
A: Gol! = Tor!
B: Fantastic! = Fantastisch!`,
tip:`«liber» (m) – «libra» (f): Eine Spielerin ruft «Jau sun libra!».`},

{id:38,m:'C',cat:'Fussball',t:'Taktik und Spielsysteme',who:'A=Trainer,B=Captain',
intro:`Über Taktik sprechen: Spielsystem, Pressing, Räume. Zahlen bei Systemen werden einzeln gesprochen.`,
v:`la tactica = die Taktik
il sistem = das System
il spazi = der Raum
stretg / stretga = eng
lartg / larga = breit
!la pressiun = das Pressing / der Druck
duvrar = nutzen / brauchen
l'adversari = der Gegner`,
s:`Oz giugain nus cun in quatter-quatter-dus. = Heute spielen wir mit einem 4-4-2.
Nus stuain far pressiun. = Wir müssen Pressing machen.
Restai stretgs en la defensiva! = Bleibt eng in der Verteidigung!
Duvrai il spazi sin las varts! = Nutzt den Raum auf den Seiten!`,
d:`A: La squadra adversaria giuga fitg svelt. = Die gegnerische Mannschaft spielt sehr schnell.
B: Tge tactica faschain nus? = Welche Taktik spielen wir?
A: Quatter-quatter-dus e blera pressiun. = 4-4-2 und viel Pressing.
B: E sch'els attatgan? = Und wenn sie angreifen?
A: Alura restain nus stretgs e spetgain. = Dann bleiben wir eng und warten ab.
B: Chapì, trenader! = Verstanden, Trainer!`,
tip:`«sch'» = wenn (vor Vokal), sonst «sche»: «sche nus gudagnain» = wenn wir gewinnen.`},

{id:39,m:'C',cat:'Fussball',t:'Über Mannschaften und Resultate sprechen',who:'A=Ramun,B=Sandro',
intro:`Resultate erzählen, über die Tabelle sprechen. Hier brauchst du die Vergangenheit (Perfekt).`,
v:`il resultat = das Resultat
gudagnar = gewinnen
perder = verlieren
!pari = unentschieden
la tabella = die Tabelle
il punct = der Punkt
la stagiun = die Saison
il campiunadi = die Meisterschaft`,
s:`Nus avain gudagnà dus a in. = Wir haben 2:1 gewonnen.
Ier avain nus pers. = Gestern haben wir verloren.
Nus essan sin l'emprim plaz da la tabella. = Wir sind auf dem ersten Platz der Tabelle.
Quants puncts avais vus? = Wie viele Punkte habt ihr?`,
d:`A: Co è ida la partida ier? = Wie lief das Spiel gestern?
B: Nus avain gudagnà trais a dus! = Wir haben 3:2 gewonnen!
A: Fantastic! Tgi ha fatg ils gols? = Fantastisch! Wer hat die Tore geschossen?

<tr><td>jau</td><td>lavur</td><td>discur</td><td>part</td></tr>
<tr><td>ti</td><td>lavuras</td><td>discurras</td><td>partas</td></tr>
<tr><td>el/ella</td><td>lavura</td><td>discurra</td><td>parta</td></tr>
<tr><td>nus</td><td>lavurain</td><td>discurrin</td><td>partin</td></tr>
<tr><td>vus</td><td>lavurais</td><td>discurris</td><td>partis</td></tr>
<tr><td>els/ellas</td><td>lavuran</td><td>discurran</td><td>partan</td></tr></table>
<p>Manche Verben erweitern den Stamm mit <b>-esch</b>: <i>chapir → jau chapesch, ti chapeschas, el chapescha</i>; <i>infurmar → jau infurmesch</i>.</p>
<p>Perfekt: avair/esser + Partizip: <i>jau hai lavurà, nus avain gudagnà, il tren è arrivà</i>.</p>`},
{t:'Satzbau',h:`<p>Grundstellung: <b>Subjekt – Verb – Objekt</b>: <i>Jau cumpr in paun.</i></p>
<p>Wie im Deutschen steht das Verb an <b>zweiter Stelle</b>. Beginnt der Satz mit einer Zeit- oder Ortsangabe, kommt das Subjekt nach dem Verb:</p>
<p><i>Oz <b>lavur</b> jau.</i> – Heute arbeite ich.<br><i>Suenter <b>vegn</b> in tren da marchanzia.</i> – Danach kommt ein Güterzug.</p>
<p>Adjektive stehen meist nach dem Nomen: <i>il signal cotschen, ina lingia lunga</i>.</p>`},
{t:'Fragen',h:`<p>Ja/Nein-Fragen durch Umstellung: <i>Ti has temp.</i> → <i>Has ti temp?</i></p>
<table><tr><th>Fragewort</th><th>Deutsch</th><th>Beispiel</th></tr>
<tr><td>tge</td><td>was / welche</td><td>Tge è capità?</td></tr>
<tr><td>tgi</td><td>wer</td><td>Tgi ha fatg il gol?</td></tr>
<tr><td>nua</td><td>wo</td><td>Nua è la staziun?</td></tr>
<tr><td>cura</td><td>wann</td><td>Cura parta il tren?</td></tr>
<tr><td>co</td><td>wie</td><td>Co stas?</td></tr>
<tr><td>pertge</td><td>warum</td><td>Pertge betg?</td></tr>
<tr><td>quant / quants</td><td>wie viel / wie viele</td><td>Quant custa quai?</td></tr>
<tr><td>danunder</td><td>woher</td><td>Danunder es ti?</td></tr>
<tr><td>quant ditg</td><td>wie lange</td><td>Quant ditg dura quai?</td></tr></table>`},
{t:'Verneinung',h:`<p>Die Verneinung umschliesst das Verb: <b>na … betg</b>. Vor Vokal wird «na» zu <b>n'</b>.</p>
<p><i>Jau na chapesch betg.</i> – Ich verstehe nicht.<br><i>Jau n'hai betg temp.</i> – Ich habe keine Zeit.<br><i>Il tren na po betg entrar.</i> – Der Zug kann nicht einfahren.</p>
<p>Weitere: <b>anc betg</b> (noch nicht), <b>nagut</b> (nichts), <b>mai</b> (nie).</p>`},
{t:'Mehrzahl',h:`<p>Nomen und Adjektive bilden die Mehrzahl meist mit <b>-s</b>:</p>
<p><i>il tren → ils trens · la staziun → las staziuns · il signal → ils signals</i></p>
<p>Adjektive passen sich in Geschlecht und Zahl an:</p>
<table><tr><th></th><th>Einzahl</th><th>Mehrzahl</th></tr>
<tr><td>männlich</td><td>in tren lung</td><td>trens lungs</td></tr>
<tr><td>weiblich</td><td>ina lingia lunga</td><td>lingias lungas</td></tr></table>`}
];

const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const uniq=a=>[...new Set(a)];
const norm=s=>String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[«»"!?.,;:()…–\-]/g,' ').replace(/\s+/g,' ').trim();
const ART=/^(il|la|ils|las|in|ina)\s+|^l'/i;
const core=rm=>rm.split(' / ')[0].replace(ART,'').replace(/[!?.]/g,'').trim();
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};

function pron(t){
  let s=t.toLowerCase().replace(/…/g,'').replace(/\s*\/\s*/g,' / ');
  s=s.replace(/tsch/g,'①').replace(/sch/g,'②').replace(/tg/g,'③').replace(/ch/g,'③')
     .replace(/gl(?=i|\b)/g,'④').replace(/gn/g,'⑤').replace(/qu/g,'⑥')
     .replace(/g[ie](?=[aeiouàèéòù])/g,'⑦').replace(/g(?=[ieè])/g,'⑦')
     .replace(/c(?=[ieè])/g,'⑧').replace(/c/g,'k').replace(/z/g,'⑧')
     .replace(/(^|[\s'])s(?=[bcdfgkmnlpqtv⑧k])/g,'$1②').replace(/s(?=[ptk])/g,'②')
     .replace(/v/g,'w').replace(/h/g,'');
  return s.replace(/①/g,'tsch').replace(/②/g,'sch').replace(/③/g,'tj').replace(/④/g,'lj').replace(/⑤/g,'nj').replace(/⑥/g,'kw').replace(/⑦/g,'dsch').replace(/⑧/g,'ts');
}

/* ================= DATEN AUFBEREITEN ================= */
function splitLine(l){const i=l.indexOf(' = ');return [l.slice(0,i).trim(),l.slice(i+3).trim()]}
const LESSONS=RAW.map(r=>{
  const v=r.v.trim().split('\n').map(l=>{l=l.trim();const u=l[0]==='!';if(u)l=l.slice(1);const [rm,de]=splitLine(l);return {rm,de,u,cat:r.cat,lesson:r.id}});
  const s=r.s.trim().split('\n').map(l=>{const [rm,de]=splitLine(l.trim());return {rm,de}});
  const d=r.d.trim().split('\n').map(l=>{l=l.trim();const sp=l[0];const [rm,de]=splitLine(l.slice(3));return {sp,rm,de}});
  const who={};r.who.split(',').forEach(p=>{const [k,n]=p.split('=');who[k]=n});
  return {...r,v,s,d,who};
});
const BYID={};LESSONS.forEach(l=>BYID[l.id]=l);
const GROUPS={A:LESSONS.filter(l=>l.m==='A'),B:LESSONS.filter(l=>l.m==='B'),C:LESSONS.filter(l=>l.m==='C')};

LESSONS.forEach(l=>l.v.forEach(w=>{if(!VKEY[w.rm]){VKEY[w.rm]=w;VOCAB.push(w)}}));
GRAMV.trim().split('\n').forEach(l=>{const [rm,de]=splitLine(l.trim());if(!VKEY[rm]){const w={rm,de,u:false,cat:'Grammatik',lesson:0};VKEY[rm]=w;VOCAB.push(w)}});
const CATS=['Alltag','Eisenbahn','Zugverkehrsleitung','Bahnhof','Kommunikation','Fussball','Grammatik'];
const ALLSENT=[];LESSONS.forEach(l=>{l.s.forEach(x=>ALLSENT.push(x));l.d.forEach(x=>ALLSENT.push({rm:x.rm,de:x.de}))});
function exampleFor(w){const c=norm(core(w.rm));if(!c||c.includes(' '))return null;const re=new RegExp('(^| )'+c.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'( |$)');return ALLSENT.find(s=>re.test(norm(s.rm)))||null}

function streakNow(){const t=todayStr();const y=new Date();y.setDate(y.getDate()-1);const ys=y.getFullYear()+'-'+String(y.getMonth()+1).padStart(2,'0')+'-'+String(y.getDate()).padStart(2,'0');return (S.streak.last===t||S.streak.last===ys)?S.streak.count:0}

let VOICE=null,VKIND='none';
function pickVoice(){if(!('speechSynthesis' in window)){VKIND='unsupported';return}const vs=speechSynthesis.getVoices();let v=vs.find(x=>/^rm/i.test(x.lang));if(v){VOICE=v;VKIND='rm';return}v=vs.find(x=>/^it[-_]/i.test(x.lang)||x.lang==='it');if(v){VOICE=v;VKIND='it';return}VOICE=null;VKIND=vs.length?'default':'none'}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice}
function utter(t,rate,pitch){const u=new SpeechSynthesisUtterance(t.replace(/…/g,'').replace(/\s\/\s/g,', '));if(VOICE){u.voice=VOICE;u.lang=VOICE.lang}else u.lang='it-IT';u.rate=rate||.88;u.pitch=pitch||1;return u}
function speak(t){if(!('speechSynthesis' in window)){toast('Sprachausgabe wird von diesem Browser nicht unterstützt.');return}pickVoice();speechSynthesis.cancel();speechSynthesis.speak(utter(t));if(!S.ttsNote){S.ttsNote=1;save();toast(VKIND==='rm'?'Rätoromanische Stimme aktiv.':'Hinweis: Keine authentische rätoromanische Stimme verfügbar – Wiedergabe mit italienischer Stimme als Annäherung.',5000)}}

/* ================= ÜBUNGSGENERATOR ================= */
function poolFor(L){return shuffle(VOCAB.filter(w=>w.lesson&&BYID[w.lesson].m===L.m&&w.lesson!==L.id))}
function distract(field,ans,pool,n){return shuffle(uniq(pool.map(w=>w[field]).filter(x=>norm(x)!==norm(ans)))).slice(0,n)}
function qRmDe(w,pool){return {type:'mc',prompt:'Was bedeutet das?',big:w.rm,say:w.rm,opts:shuffle([w.de,...distract('de',w.de,pool,3)]),ans:w.de,word:w}}
function qDeRm(w,pool){return {type:'mc',prompt:'Wie sagt man das auf Rumantsch?',big:w.de,opts:shuffle([w.rm,...distract('rm',w.rm,pool,3)]),ans:w.rm,word:w,sayAns:1}}
function qMatch(ws){return {type:'match',prompt:'Verbinde die Paare',pairs:ws.map(w=>({rm:w.rm,de:w.de,w}))}}
function qBuild(s){return {type:'build',prompt:'Bilde den Satz auf Rumantsch',big:s.de,ans:s.rm,toks:s.rm.split(' ')}}
function qType(w){return {type:'type',prompt:'Schreibe auf Rumantsch',big:w.de,ans:w.rm,word:w}}
function qGap(L,pool){
  const cands=shuffle(L.v.filter(w=>{const c=core(w.rm);return c&&!c.includes(' ')}));
  const sents=shuffle([...L.s,...L.d]);
  for(const w of cands){const c=norm(core(w.rm));
    for(const s of sents){const toks=s.rm.split(' ');const i=toks.findIndex(t=>norm(t)===c);
      if(i>=0){const shown=toks.map((t,j)=>j===i?t.replace(/[^!?.,:;«»]+/,'_____'):t).join(' ');
        const others=uniq([...L.v,...pool].map(x=>core(x.rm)).filter(x=>x&&!x.includes(' ')&&norm(x)!==c));
        const fill=toks[i].replace(/[!?.,:;«»]/g,'');
        return {type:'mc',prompt:'Ergänze die Lücke',big:shown,sub:s.de,opts:shuffle([fill,...shuffle(others).slice(0,3)]),ans:fill,word:w,full:s.rm}}}}
  return null;
}
function qDialog(L){
  const idx=[];for(let i=0;i<L.d.length-1;i++)if(L.d[i].sp!==L.d[i+1].sp)idx.push(i);
  if(!idx.length)return null;const i=shuffle(idx)[0];const ans=L.d[i+1].rm;
  const others=shuffle(LESSONS.filter(x=>x.id!==L.id&&x.m===L.m).flatMap(x=>x.d.map(y=>y.rm))).filter(x=>x!==ans).slice(0,2);
  return {type:'mc',prompt:'Was passt als Antwort im Gespräch?',big:L.d[i].rm,sub:L.d[i].de,say:L.d[i].rm,opts:shuffle([ans,...others]),ans,sayAns:1};
}
function buildSents(L){return shuffle([...L.s,...L.d.map(x=>({rm:x.rm,de:x.de}))].filter(s=>{const n=s.rm.split(' ').length;return n>=3&&n<=8}))}
function genExercises(L){
  const pool=poolFor(L);const v=shuffle(L.v);const g=i=>v[i%v.length];const bs=buildSents(L);
  return [qRmDe(g(0),[...L.v,...pool]),qMatch(shuffle(L.v).slice(0,4)),qDeRm(g(1),[...L.v,...pool]),qGap(L,pool)||qRmDe(g(2),[...L.v,...pool]),qBuild(bs[0]||L.s[0]),qRmDe(g(3),[...L.v,...pool])];
}
function genTest(L){
  const pool=poolFor(L);const v=shuffle(L.v);const g=i=>v[i%v.length];const bs=buildSents(L);
  return [qDeRm(g(0),[...L.v,...pool]),qRmDe(g(1),[...L.v,...pool]),qGap(L,pool)||qDeRm(g(2),[...L.v,...pool]),qBuild(bs[1]||bs[0]||L.s[1]),qDialog(L)||qRmDe(g(4),[...L.v,...pool]),qType(g(5))];
}
function typeOk(input,ans){
  const n=norm(input);if(!n)return false;
  const vars=[];ans.split(' / ').forEach(a=>{vars.push(a);vars.push(a.replace(ART,''))});
  if(ans.includes(' / ')){const base=ans.split(' / ')[0].match(ART);if(base)ans.split(' / ').slice(1).forEach(a=>vars.push(base[0]+a))}
  const sq=x=>x.replace(/['\s]/g,'');return vars.some(a=>norm(a)===n||sq(norm(a))===sq(n));
}

/* ================= FRAGE-RENDERER ================= */
let fbCb=null;
function closeFb(){const f=document.querySelector('.fb');if(f)f.remove();fbCb=null}
function feedback(ok,html,cb){closeFb();const d=document.createElement('div');d.className='fb '+(ok?'ok':'bad');d.innerHTML=`<div class="in"><h3>${ok?'✓ Richtig!':'✗ Nicht ganz'}</h3><div class="mb">${html||''}</div><button class="btn">Weiter</button></div>`;document.body.appendChild(d);fbCb=cb;d.querySelector('.btn').onclick=()=>{const c=fbCb;closeFb();c&&c()}}
function renderQ(q,box,done){
  const head=`<div class="kicker">${esc(q.prompt)}</div>`;
  if(q.type==='mc'){
    box.innerHTML=`${head}<div class="big">${esc(q.big)} ${q.say?sayBtn(q.say):''}</div>${q.sub?`<p class="mut">${esc(q.sub)}</p>`:''}<div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-i="${i}">${esc(o)}</button>`).join('')}</div>`;
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      const o=q.opts[+b.dataset.i];const ok=o===q.ans;
      box.querySelectorAll('.opt').forEach(x=>{x.disabled=true;if(q.opts[+x.dataset.i]===q.ans)x.classList.add('ok')});
      if(!ok)b.classList.add('bad');
      rec(q.word,ok);if(q.sayAns||ok)speak(q.full||q.ans);
      done(ok,ok?(q.full?`<b>${esc(q.full)}</b>`:''):`Richtig ist: <b>${esc(q.ans)}</b>${q.full?`<br><span class="small">${esc(q.full)}</span>`:''}`);
    });
  }else if(q.type==='match'){
    const L=shuffle(q.pairs.map((p,i)=>({t:p.rm,i}))),R=shuffle(q.pairs.map((p,i)=>({t:p.de,i})));let sel=null,errs=0,left=q.pairs.length;
    box.innerHTML=`${head}<p class="mut small">Tippe links ein Wort und rechts die Übersetzung.</p><div class="match">${L.map((x,k)=>`<button class="opt" data-s="L" data-i="${x.i}" style="grid-column:1;grid-row:${k+1}">${esc(x.t)}</button>`).join('')}${R.map((x,k)=>`<button class="opt" data-s="R" data-i="${x.i}" style="grid-column:2;grid-row:${k+1}">${esc(x.t)}</button>`).join('')}</div>`;
    box.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{
      if(b.classList.contains('gone'))return;
      if(!sel||sel.dataset.s===b.dataset.s){if(sel)sel.classList.remove('sel');sel=b;b.classList.add('sel');if(b.dataset.s==='L')speak(q.pairs[+b.dataset.i].rm);return}
      if(sel.dataset.i===b.dataset.i){[sel,b].forEach(x=>{x.classList.remove('sel');x.classList.add('gone');x.disabled=true});rec(q.pairs[+b.dataset.i].w,true);left--;sel=null;
        if(!left){const ok=errs<=1;done(ok,ok?'Alle Paare gefunden.':`Alle Paare gefunden – aber mit ${errs} Fehlern.`)}}
      else{errs++;const wi=sel.dataset.s==='L'?+sel.dataset.i:+b.dataset.i;rec(q.pairs[wi].w,false);[sel,b].forEach(x=>{x.classList.add('bad');setTimeout(()=>x.classList.remove('bad','sel'),450)});sel=null}
    });
  }else if(q.type==='build'){
    const bank=shuffle(q.toks.map((t,i)=>({t,i})));const pick=[];
    box.innerHTML=`${head}<div class="big" style="font-size:21px">${esc(q.big)}</div><div class="zone" id="zone"></div><div class="bank" id="bank"></div><div class="row"><button class="btn ghost" id="bclr">Zurücksetzen</button><button class="btn" id="bchk" disabled>Prüfen</button></div>`;
    const draw=()=>{box.querySelector('#zone').innerHTML=pick.map((p,k)=>`<button class="tile" data-k="${k}">${esc(p.t)}</button>`).join('');
      box.querySelector('#bank').innerHTML=bank.map((b,k)=>`<button class="tile ${pick.includes(b)?'used':''}" data-b="${k}">${esc(b.t)}</button>`).join('');
      box.querySelector('#bchk').disabled=pick.length!==bank.length;
      box.querySelectorAll('[data-b]').forEach(x=>x.onclick=()=>{const b=bank[+x.dataset.b];if(!pick.includes(b)){pick.push(b);draw()}});
      box.querySelectorAll('[data-k]').forEach(x=>x.onclick=()=>{pick.splice(+x.dataset.k,1);draw()});};
    draw();
    box.querySelector('#bclr').onclick=()=>{pick.length=0;draw()};
    box.querySelector('#bchk').onclick=()=>{const s=pick.map(p=>p.t).join(' ');const ok=norm(s)===norm(q.ans);box.querySelectorAll('.tile,.btn').forEach(x=>x.disabled=true);speak(q.ans);done(ok,ok?`<b>${esc(q.ans)}</b>`:`Richtig ist: <b>${esc(q.ans)}</b>`)};
  }else if(q.type==='type'){
    box.innerHTML=`${head}<div class="big">${esc(q.big)}</div><p class="mut small">Akzente und Grossschreibung sind egal. Der Artikel ist optional.</p><input class="inp" id="tin" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="Auf Rumantsch …"><div class="mt"><button class="btn" id="tchk">Prüfen</button></div>`;
    const inp=box.querySelector('#tin');const chk=()=>{const ok=typeOk(inp.value,q.ans);inp.disabled=true;box.querySelector('#tchk').disabled=true;rec(q.word,ok);speak(q.ans);done(ok,ok?`<b>${esc(q.ans)}</b>`:`Richtig ist: <b>${esc(q.ans)}</b>`)};
    box.querySelector('#tchk').onclick=chk;inp.onkeydown=e=>{if(e.key==='Enter')chk()};
  }

  ${SIMS.map(s=>`<button class="li ${S.sims[s.id]?'done':''}" onclick="go('sim/${s.id}')"><div class="n">${S.sims[s.id]?'✓':s.id}</div><div class="t"><b>${esc(s.t)}</b><small>${'●'.repeat(s.lvl)}${'○'.repeat(3-s.lvl)} Schwierigkeit · ${s.steps.length} Schritte${S.sims[s.id]?` · Bestwert ${S.sims[s.id]}/${s.steps.length}`:''}</small></div><div class="arr">›</div></button>`).join('')}
